<style>
:root{
  --font:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --bg:#EDF0ED; --surface:#fff; --soft:#F6F8F6;
  --ink:#16242B; --mute:#56676E; --line:#D2DAD6; --line-strong:#AEBBB5;
  --denim:#2A4A7F; --denim-ink:#1B3562; --denim-wash:#D6E1F1; --denim-pale:#EAF0F8;
  --idee:#7F520A; --idee-bg:#FBF0D6; --idee-line:#C58A1A;
  --valide:#1B6444; --valide-bg:#DCF1E4; --valide-line:#2E8D62;
  --planifie:#4B3F8F; --planifie-bg:#E9E5F6; --planifie-line:#8575C9;
  --refuse:#942A22; --refuse-bg:#F9E1DE; --refuse-line:#C4483E;
  --publie:#42535B; --publie-bg:#E3E8EA; --publie-line:#778990;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
h1,h2,h3,h4,p,dl,dd,fieldset{margin:0;padding:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--denim);outline-offset:2px}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- barre du haut ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line-strong);display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 24px}
.brand{display:flex;align-items:center;gap:11px}
.brand-txt{display:flex;align-items:baseline;gap:10px}
.logo{height:44px;width:auto;flex:none;display:block}
.brand h1{font-size:21px;font-weight:700;color:var(--denim);letter-spacing:-.01em}
.brand span{color:var(--mute);font-size:14px}
.tabs{display:flex;gap:4px}
.tab{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:700;color:var(--mute)}
.tab:hover{background:var(--soft);color:var(--ink)}
.tab[aria-current=page]{background:var(--denim-wash);color:var(--denim-ink)}
.badge{min-width:24px;padding:0 6px;border-radius:12px;border:1.5px dashed var(--idee-line);background:var(--idee-bg);color:var(--idee);font-size:13px;line-height:20px;text-align:center}
.top-actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}

/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;border-radius:8px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:700;line-height:1.3}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--denim);border-color:var(--denim);color:#fff}
.btn.primary:hover{background:var(--denim-ink);border-color:var(--denim-ink)}
.btn.ok{background:var(--valide);border-color:var(--valide);color:#fff}
.btn.ok:hover{background:#12513A;border-color:#12513A}
.btn.no{color:var(--refuse);border-color:var(--refuse-line)}
.btn.no:hover{background:var(--refuse-bg);border-color:var(--refuse)}
.btn.danger{color:var(--refuse);border-color:transparent;background:none}
.btn.danger:hover{background:var(--refuse-bg)}
.btn.danger.armed{background:var(--refuse);color:#fff;border-color:var(--refuse)}
.btn.small{padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:8px;border:1.5px solid var(--line-strong);background:var(--surface);font-size:18px}
.icon-btn:hover{border-color:var(--ink)}

#banner{background:var(--refuse);color:#fff;text-align:center;padding:8px 16px;font-weight:700}

/* ---------- pages ---------- */
.page{max-width:1320px;margin:0 auto;padding:20px 24px 56px}
.loading,.empty{padding:48px 0;color:var(--mute);text-align:center}
.empty{display:grid;gap:14px;justify-items:center;max-width:46ch;margin:0 auto}
.empty strong{color:var(--ink);font-size:18px}

.cal-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin-bottom:14px}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav h2{font-size:27px;font-weight:700;letter-spacing:-.015em;margin:0 8px 0 10px;min-width:8.5em}
.filters{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}

/* ---------- pastilles de statut (calendrier, filtres, listes) ---------- */
.chip{display:grid;grid-template-columns:auto 1fr;gap:1px 6px;width:100%;text-align:left;padding:4px 7px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);font-size:12.5px;line-height:1.3}
.chip .ic{margin-top:2px;font-size:13px}
.chip .ttl{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.net{display:inline-block;width:18px;height:18px;flex:none;vertical-align:middle}
.nets{display:inline-flex;gap:4px;margin-right:8px;vertical-align:middle}
.opt .net{margin-right:7px}
.chip .sub .net{margin-top:0}
.chip .sub{align-items:center;grid-column:2;display:flex;flex-wrap:wrap;gap:0 7px;color:var(--mute);font-size:11.5px}
.s-idee{border:1.5px dashed var(--idee-line)}
.s-idee .ic{color:var(--idee)}
.s-valide{background:var(--valide-bg);border-color:var(--valide-line)}
.s-valide .ic{color:var(--valide)}
.s-planifie{background:var(--planifie-bg);border-color:var(--planifie-line)}
.s-planifie .ic{color:var(--planifie)}
.s-refuse{background:var(--refuse-bg);border-color:var(--refuse-line)}
.s-refuse .ic{color:var(--refuse)}
.s-refuse .ttl{text-decoration:line-through;text-decoration-thickness:1.5px}
.s-publie{background:var(--publie-bg);border-color:var(--publie-line)}
.s-publie .ic{color:var(--publie)}
.chip:hover{filter:brightness(.97);border-color:var(--ink)}

.filter{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.filter .n{color:var(--mute);font-weight:400}
.filter.s-idee{border-style:dashed}
.filter[aria-pressed=false]{background:transparent;border:1.5px solid var(--line);color:var(--mute)}
.filter[aria-pressed=false] .ic{color:var(--mute)}

/* ---------- grille du mois ---------- */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line-strong);border:1px solid var(--line-strong);border-radius:12px;overflow:clip}
.dow{background:var(--soft);padding:8px 10px;font-weight:700;font-size:13.5px;color:var(--mute)}
.grid.compact .day{min-height:92px}
.day{background:var(--surface);min-height:132px;display:flex;flex-direction:column;position:relative}
.day.weekend{background:#FAFBFA}
.day.out{background:var(--soft)}
.day.out .dn{color:var(--mute);font-weight:400}
.day-head{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 3px 8px;min-height:34px}
.dn{font-weight:700;font-size:14px;padding:0 2px}
.today .dn{background:var(--denim);color:#fff;border-radius:12px;padding:1px 9px}
.add{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;border:1.5px solid transparent;background:none;color:var(--mute);opacity:0}
.day:hover .add,.add:focus-visible{opacity:1}
.add:hover{border-color:var(--line-strong);background:var(--surface);color:var(--ink)}
@media (hover:none){.add{opacity:.55}}
.lanes{display:flex;flex-direction:column;gap:3px;margin:0 0 5px}
.lane{height:21px;position:relative}
.bar{position:absolute;top:0;bottom:0;left:0;right:-1px;border:0;padding:0;background:var(--denim-wash);color:var(--denim-ink);text-align:left}
.bar.start{left:6px;border-radius:11px 0 0 11px}
.bar.end{right:6px;border-radius:0 11px 11px 0}
.bar.start.end{border-radius:11px}
.bar:hover{background:#C5D5EB}
.bar .lbl{position:absolute;z-index:3;left:8px;top:0;height:100%;display:block;line-height:21px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.bar.start .lbl{left:14px}
.day-posts{display:flex;flex-direction:column;gap:4px;padding:0 6px 8px}

/* agenda (petits écrans) */
.agenda{display:none}
@media (max-width:820px){
  .grid{display:none}
  .agenda{display:grid;gap:10px}
  .page{padding:14px 14px 48px}
  .topbar{padding:10px 14px}
  .cal-nav{flex-wrap:wrap}
  .cal-nav h2{font-size:21px;min-width:0;white-space:nowrap}
  .filters{margin-left:0}
}
.ag-day{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.ag-day .cdate small{display:block}
.ag-posts{display:grid;gap:6px}
.ag-events{display:grid;gap:6px;margin-bottom:4px}
.ag-ev{display:flex;flex-wrap:wrap;gap:0 10px;align-items:baseline;width:100%;text-align:left;border:0;border-left:4px solid var(--denim);background:var(--denim-pale);padding:7px 10px;border-radius:0 8px 8px 0}
.ag-ev small{color:var(--mute)}

/* ---------- vue « À valider » et événements ---------- */
.group-title{font-size:19px;font-weight:700;margin:28px 0 10px}
.group-title:first-child{margin-top:4px}
.list{display:grid;gap:12px;max-width:920px}
.mois{max-width:920px;margin:0 0 18px}
.mois-filtre{display:flex;flex-wrap:wrap;gap:8px;max-width:920px;margin:0 0 18px}
.mois-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:20px;padding:6px 14px;font-weight:700;color:var(--ink)}
.mois-chip:hover{background:var(--soft)}
.mois-chip[aria-pressed=true]{background:var(--denim);border-color:var(--denim);color:#fff}
.mois-chip .n{display:inline-block;min-width:22px;text-align:center;padding:0 7px;border-radius:12px;font-size:13px;background:var(--idee-bg);color:var(--idee);border:1px solid var(--idee-line)}
.val-bar{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px 20px;margin:0 0 18px}
.val-bar .mois-filtre{margin:0;flex:1 1 360px}
.vue-toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface)}
.vue-toggle button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:7px 14px;font-weight:700;color:var(--mute)}
.vue-toggle button+button{border-left:1px solid var(--line-strong)}
.vue-toggle button:hover{background:var(--soft);color:var(--ink)}
.vue-toggle button[aria-pressed=true]{background:var(--denim);color:#fff}
.mois-chip[aria-pressed=true] .n{background:#fff;color:var(--denim-ink);border-color:#fff}
.mois-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--denim-pale);border:1px solid var(--denim-wash);border-left:5px solid var(--denim);border-radius:8px;padding:9px 14px;font-size:19px;font-weight:700;color:var(--denim-ink)}
.mois-btn:hover{background:var(--denim-wash)}
.mois-btn::before{content:"";width:9px;height:9px;border-right:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s;flex:none}
.mois-btn[aria-expanded=false]::before{transform:rotate(-45deg)}
.mois-btn .pill{margin-left:auto;font-size:13px}
.mois .list{margin-top:12px}
@media (prefers-reduced-motion:reduce){.mois-btn::before{transition:none}}
.card{display:grid;grid-template-columns:64px minmax(0,1fr);gap:6px 18px;padding:16px 18px;background:var(--surface);border-radius:12px}
.card.idea{border:1.5px dashed var(--idee-line)}
.cdate{text-align:center;line-height:1.15}
.cdate .n{display:block;font-size:30px;font-weight:700}
.cdate small{color:var(--mute);font-size:13.5px}
.card h3{font-size:18px;line-height:1.3;margin-bottom:2px}
.meta{color:var(--mute);font-size:14px}
.tag-past{display:inline-block;margin-left:6px;padding:0 8px;border-radius:10px;background:var(--soft);border:1px solid var(--line);color:var(--mute);font-size:12.5px}
.card.past .cdate{opacity:.6}
.legende{white-space:pre-wrap;margin-top:10px;padding:10px 12px;background:var(--soft);border-radius:8px;border-left:3px solid var(--line-strong)}
.tags{margin-top:8px;color:var(--denim-ink);font-weight:700;overflow-wrap:anywhere}
/* texte [entre crochets] : mis en avant partout où un champ est affiché */
mark.br{background:#FFE48A;color:var(--ink);font-weight:700;border-radius:4px;padding:0 3px;box-shadow:inset 0 -2px 0 #C99700;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.facts{display:grid;gap:8px;margin-top:10px;font-size:14.5px}
.facts dt{font-weight:700}
.facts dd{color:#2B3B42}
.alert{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;background:var(--idee-bg);border-radius:8px;color:#5E3C05}
.alert .ic{margin-top:3px;flex:none;color:var(--idee)}
.evnote{padding:9px 12px;background:var(--denim-pale);border-radius:8px;border-left:3px solid var(--denim)}
.evnote p+p{margin-top:4px}
.actions{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ev-card{border:1px solid var(--line);border-left:5px solid var(--denim)}
.ev-card h3{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.pill{display:inline-block;padding:1px 10px;border-radius:12px;font-size:13px;font-weight:700;background:var(--soft);border:1px solid var(--line);color:var(--mute)}
.pill.warn{background:var(--idee-bg);border:1.5px dashed var(--idee-line);color:var(--idee)}
.ev-posts{display:grid;gap:6px;margin-top:10px;max-width:520px}

/* ---------- tiroir et fenêtres ---------- */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(22,36,43,.5)}
dialog.drawer{margin:0 0 0 auto;height:100dvh;max-height:none;width:min(580px,100vw);max-width:none;border-radius:0;box-shadow:-10px 0 40px rgba(22,36,43,.22)}
dialog.drawer[open]{display:flex;flex-direction:column;animation:slide .2s ease-out}
dialog.modal{width:min(500px,calc(100vw - 28px));border-radius:14px;box-shadow:0 20px 60px rgba(22,36,43,.3)}
@keyframes slide{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
.dr-head,.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.dr-head h2,.modal-head h2{font-size:20px}
.dr-form{display:flex;flex-direction:column;flex:1;min-height:0}
.dr-body{flex:1;overflow-y:auto;padding:18px 20px;display:grid;gap:16px;align-content:start}
.dr-foot,.modal-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--soft)}
.dr-foot .spacer{margin-right:auto}
.modal-form{display:grid}
.modal-form>p,.modal-form>fieldset,.modal-form>label{margin:16px 20px 0}
.modal-form>.modal-head{margin:0}
.modal-form>.modal-foot{margin-top:18px}
.f{display:grid;gap:5px}
.f>span,legend{font-weight:700;font-size:14.5px}
.f>span em,legend em{font-weight:400;font-style:normal;color:var(--mute);font-size:13.5px;margin-left:4px}
input[type=text],input[type=date],input[type=time],input[type=password],select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface)}
textarea{resize:vertical;min-height:2.6em;line-height:1.45}
input:hover,select:hover,textarea:hover{border-color:var(--ink)}
/* surcouche des champs de saisie : même texte, invisible, avec un fond derrière les [crochets].
   Aucune différence de graisse ni de marge dans la surcouche, sinon le texte se décalerait. */
.hl-wrap{position:relative;border-radius:8px;background:var(--surface)}
.hl-wrap>.hl-field{position:relative;display:block;background:transparent}
.hl-back{position:absolute;inset:0;margin:0;padding:9px 11px;border:1.5px solid transparent;border-radius:8px;overflow:hidden;font:inherit;color:transparent;white-space:pre-wrap;overflow-wrap:break-word;pointer-events:none}
.hl-back.ta{line-height:1.45}
.hl-back.one{white-space:pre}
.hl-back mark.br{background:#FFE48A;color:transparent;font-weight:inherit;padding:0;border-radius:3px;box-shadow:0 0 0 1px #E3B91F}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:0;display:grid;gap:8px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:8px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:700;font-size:14.5px}
.opt input:checked+span{background:var(--denim-wash);border-color:var(--denim);color:var(--denim-ink)}
.opt input:focus-visible+span{outline:3px solid var(--denim);outline-offset:2px}
.opt.st-idee input:checked+span{background:var(--idee-bg);border:1.5px dashed var(--idee-line);color:var(--idee)}
.opt.st-valide input:checked+span{background:var(--valide-bg);border-color:var(--valide-line);color:var(--valide)}
.opt.st-planifie input:checked+span{background:var(--planifie-bg);border-color:var(--planifie-line);color:var(--planifie)}
.opt.st-refuse input:checked+span{background:var(--refuse-bg);border-color:var(--refuse-line);color:var(--refuse)}
.opt.st-publie input:checked+span{background:var(--publie-bg);border-color:var(--publie-line);color:var(--publie)}
.count{font-size:13.5px;color:var(--mute)}
.count.over{color:var(--refuse);font-weight:700}
.evinfo{margin-top:2px}
.hint{font-size:13.5px;color:var(--mute)}
.hint.over{color:var(--refuse);font-weight:700}
.pills+.hint{margin-top:8px}
.form-error{padding:9px 12px;border-radius:8px;background:var(--refuse-bg);color:var(--refuse);font-weight:700}
.export-count{padding:10px 12px;background:var(--denim-pale);border-radius:8px;font-weight:700}
.sub-dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 0 26px}
.radio{display:flex;align-items:center;gap:9px}
.radio input{width:18px;height:18px;margin:0;accent-color:var(--denim)}

/* ---------- message flottant ---------- */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:14px;max-width:min(560px,calc(100vw - 28px));padding:11px 16px;border-radius:10px;background:var(--ink);color:#fff;box-shadow:0 8px 28px rgba(22,36,43,.35)}
#toast.error{background:var(--refuse)}
#toast button{border:0;background:none;color:#BFD3F5;font-weight:700;text-decoration:underline;padding:2px 4px}
#toast.error button{color:#fff}

@media (max-width:560px){
  .row2,.sub-dates{grid-template-columns:1fr}
  .card{grid-template-columns:1fr}
  .cdate{text-align:left;display:flex;gap:8px;align-items:baseline}
  .cdate .n{font-size:22px}
  .actions{grid-column:1}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}

/* ---------- photos ---------- */
.ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.ph-slot{display:grid;gap:8px;align-content:start;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--soft)}
.ph-slot h4{font-size:14px;line-height:1.3}
.ph-box{aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--surface);color:var(--mute);font-size:13.5px;text-align:center}
.ph-box img{width:100%;height:100%;object-fit:contain;background:#EEF1EF}
.ph-actions{display:flex;flex-wrap:wrap;gap:6px}
.ph-err{font-size:13.5px}
.ph-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.ph-fig{margin:0;width:210px}
.ph-fig img{display:block;width:100%;max-height:220px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:#EEF1EF}
.ph-fig figcaption{margin-top:4px;font-size:13px;color:var(--mute)}
.ph-fig .btn{margin-top:6px}
/* plusieurs images sur un visuel = carrousel : vignettes numérotées, dans l'ordre de publication */
.ph-strip{display:block}
.ph-car{width:auto;max-width:min(100%,430px)}
.ph-car .ph-strip{display:flex;flex-wrap:wrap;gap:6px}
.ph-car .ph-thumb{width:86px}
.ph-car .ph-fig img,.ph-car img{max-height:none;aspect-ratio:1;height:auto}
.ph-thumb{position:relative}
.ph-num{position:absolute;left:5px;top:5px;display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--denim);color:#fff;font-size:12.5px;font-weight:700;line-height:1;pointer-events:none;box-shadow:0 0 0 2px #fff}
.ph-count{font-weight:400;color:var(--mute);font-size:13.5px}
.ph-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;padding:8px;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface)}
.ph-item{display:grid;gap:5px;align-content:start}
.ph-item .ph-zoom{aspect-ratio:1;overflow:hidden;border:1px solid var(--line)}
.ph-item .ph-zoom img{width:100%;height:100%;object-fit:contain;background:#EEF1EF}
.ph-tools{display:flex;gap:3px}
.ph-tools .btn{flex:1;min-width:0;padding:4px 0;font-size:15px}
.ph-tools .btn .ic{width:16px;height:16px}
/* clic sur une photo : affichage en grand */
.ph-zoom{position:relative;display:block;width:100%;padding:0;border:0;border-radius:8px;background:none;cursor:zoom-in}
.ph-box{position:relative}
.ph-box .ph-zoom{position:absolute;inset:0;height:100%}
.ph-zoom .ic{position:absolute;right:6px;bottom:6px;width:28px;height:28px;padding:6px;border-radius:7px;background:rgba(22,36,43,.78);color:#fff;pointer-events:none}
.ph-zoom:hover .ic,.ph-zoom:focus-visible .ic{background:var(--denim)}
dialog.lightbox{margin:0;width:100vw;height:100dvh;max-width:none;max-height:none;background:rgba(10,18,22,.96);color:#fff}
dialog.lightbox[open]{display:grid;place-items:center;animation:fade .15s ease-out}
dialog.lightbox::backdrop{background:transparent}
.lb-close{position:fixed;top:14px;right:14px;z-index:1;color:var(--ink)}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);z-index:1;width:48px;height:56px;font-size:32px;line-height:1;color:var(--ink)}
.lb-prev{left:12px}
.lb-next{right:12px}
@media (max-width:640px){.lb-nav{top:auto;bottom:18px;transform:none}.lb-fig{padding-bottom:84px}.lb-fig img{max-height:calc(100dvh - 180px)}}
.lb-fig{display:grid;gap:10px;justify-items:center;max-width:100%;margin:0;padding:64px 16px 16px;cursor:zoom-out}
.lb-fig img{max-width:100%;max-height:calc(100dvh - 120px);object-fit:contain;border-radius:6px;background:#EEF1EF;box-shadow:0 10px 50px rgba(0,0,0,.5)}
.lb-fig figcaption{max-width:min(100%,900px);font-size:14px;color:#E8EEEA;text-align:center;overflow-wrap:anywhere}
@keyframes fade{from{opacity:0}to{opacity:1}}
.chip .ph-ico{display:inline-flex;align-items:center}
.chip .ph-ico .ic{margin-top:0;font-size:12px}
.chip .ph-ico .ph-n{margin-left:1px;font-size:11px;font-weight:700;line-height:1}
@media (max-width:640px){.ph-grid{grid-template-columns:1fr}}

/* ---------- glisser-déposer, déplacer, cloner, fusionner ---------- */
.chip-wrap{display:block;cursor:grab}
.chip-wrap.dragging{opacity:.4}
.day.drop-ok{outline:3px solid var(--denim);outline-offset:-3px;background:var(--denim-pale)}
.day.drop-ok.copie{outline-style:dashed}
.dnd-hint{margin:-4px 0 10px}
@media (hover:none),(max-width:820px){.dnd-hint{display:none}}
.dr-tools{display:flex;flex-wrap:wrap;gap:8px}
.modal-form>.blk{margin:16px 20px 0}
.modal-foot .spacer{margin-right:auto}
dialog.modal.large{width:min(780px,calc(100vw - 28px))}
#actionDlg[open]{display:flex;flex-direction:column;max-height:calc(100dvh - 24px);overflow:hidden}
#actionDlg>.modal-form{display:flex;flex-direction:column;flex:1;min-height:0}
#actionDlg .modal-head,#actionDlg .modal-foot{flex:none}
#actionDlg .modal-form>.modal-foot{margin-top:0}
#actionDlg .am-body{display:grid;align-content:start;flex:1;min-height:0;overflow:auto;padding-bottom:18px}
#actionDlg .am-body>p,#actionDlg .am-body>label,#actionDlg .am-body>fieldset,#actionDlg .am-body>.blk{margin:16px 20px 0}
.date-row{display:flex;gap:8px;align-items:center}
.date-row input{flex:1}
.date-rows{display:grid;gap:8px}
.cand-list{display:grid;gap:6px;max-height:min(340px,45dvh);overflow:auto;padding:3px}
.cand,.mg-opt{position:relative;display:block}
.cand input,.mg-opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.cand-body,.mg-box{display:block;padding:8px 12px;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface)}
.cand input:checked+.cand-body,.mg-opt input:checked+.mg-box{background:var(--denim-wash);border-color:var(--denim)}
.cand input:focus-visible+.cand-body,.mg-opt input:focus-visible+.mg-box{outline:3px solid var(--denim);outline-offset:2px}
.cand-body small{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;color:var(--mute);font-size:13.5px}
.cand-body .nets{margin-right:0}
.mg-field{border:0;display:grid;gap:6px;margin:16px 20px 0}
.mg-pair,.mg-trio{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mg-trio{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.mg-box{white-space:pre-wrap;overflow-wrap:anywhere;height:100%}
.mg-who{display:block;margin-bottom:3px;font-size:12.5px;font-weight:700;color:var(--mute)}
.mg-opt input:checked+.mg-box .mg-who{color:var(--denim-ink)}
.mg-img{display:block;width:100%;max-height:170px;object-fit:contain;margin-top:4px;border-radius:6px;background:#EEF1EF}
.mg-imgs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mg-imgs .mg-img{width:calc(33.333% - 3px);max-height:76px;margin-top:0}
.mg-imgs.un .mg-img{width:100%;max-height:170px}
.mg-box small{display:block;margin-top:4px;color:var(--mute);font-size:13px}
.mg-auto h3{font-size:15px;margin-bottom:6px}
.mg-auto dl{display:grid;gap:5px;font-size:14px}
.mg-auto dt{display:inline;font-weight:700}
.mg-auto dt::after{content:" : "}
.mg-auto dd{display:inline;overflow-wrap:anywhere}
.mg-auto small{color:var(--mute)}
@media (max-width:640px){.mg-pair{grid-template-columns:1fr}}

/* ---------- dock : annuler, rétablir, agent IA (suit la fenêtre ouverte, voir placerDock) ---------- */
#dock{position:fixed;right:18px;bottom:18px;z-index:70;display:flex;flex-direction:column;align-items:flex-end;gap:10px;color:var(--ink);font-size:15px}
.dock-btns{display:flex;align-items:center;gap:8px}
.dock-btns .icon-btn{width:42px;height:42px;box-shadow:0 3px 12px rgba(22,36,43,.2)}
.dock-btns .icon-btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line-strong)}
.ia-fab{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;border:0;background:var(--denim);color:#fff;font-size:25px;box-shadow:0 6px 20px rgba(22,36,43,.35)}
.ia-fab:hover{background:var(--denim-ink)}
.ia-panel{display:flex;flex-direction:column;width:min(390px,calc(100vw - 32px));height:min(580px,calc(100dvh - 110px));background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 14px 44px rgba(22,36,43,.32);overflow:hidden}
.ia-head{display:flex;align-items:center;gap:6px;padding:9px 10px 9px 15px;background:var(--denim);color:#fff}
.ia-head strong{flex:1;min-width:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ia-head button{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:7px;background:none;color:#fff;font-size:18px}
.ia-head button:hover{background:rgba(255,255,255,.18)}
.ia-head :focus-visible{outline-color:#fff}
.ia-ctx{padding:6px 15px;background:var(--denim-pale);color:var(--denim-ink);font-size:13.5px;font-weight:700;border-bottom:1px solid var(--denim-wash);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ia-log{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.ia-msg{max-width:88%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.42}
.ia-msg.user{align-self:flex-end;background:var(--denim);color:#fff;border-bottom-right-radius:3px}
.ia-msg.assistant{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:3px}
.ia-msg.erreur{align-self:stretch;max-width:none;background:var(--refuse-bg);color:var(--refuse);font-weight:700}
.ia-ligne{display:flex;align-items:flex-end;gap:6px;align-self:flex-start;max-width:96%}
.ia-ligne .ia-msg{max-width:none;min-width:0}
.ia-msg.assistant{white-space:normal}
.ia-texte{display:grid;gap:7px}
.ia-texte ul,.ia-texte ol{margin:0;padding-left:20px;display:grid;gap:5px}
.ia-texte .ia-titre{font-weight:700;color:var(--denim-ink)}
.ia-texte code{padding:0 4px;border-radius:4px;background:var(--soft);font-size:.92em}

.ia-mascotte.grande{width:96px;height:96px}
.ia-actions{list-style:none;margin:7px 0 0;padding:7px 0 0;border-top:1px solid var(--line);display:grid;gap:3px;font-size:13.5px;color:var(--valide)}
.ia-actions li{display:flex;gap:6px;align-items:flex-start;white-space:normal}
.ia-actions .ic{margin-top:3px}
.ia-lien{border:0;background:none;padding:0;margin-top:5px;color:var(--denim);font-weight:700;font-size:13.5px;text-decoration:underline}
.ia-confirm{align-self:stretch;display:grid;gap:7px;padding:10px 12px;border:1.5px solid var(--refuse-line);border-radius:10px;background:var(--surface)}
.ia-confirm p{overflow-wrap:anywhere}
.ia-confirm .boutons{display:flex;gap:8px}
.ia-confirm.clos{border-color:var(--line);color:var(--mute)}
.ia-vide{margin:auto;max-width:30ch;display:grid;gap:10px;justify-items:center;text-align:center;color:var(--mute)}
.ia-attente{align-self:flex-start;color:var(--mute);font-size:14px;animation:ia-pulse 1.2s ease-in-out infinite}
@keyframes ia-pulse{50%{opacity:.45}}
.ia-sugg{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 0;background:var(--surface);border-top:1px solid var(--line)}
.ia-saisie{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;background:var(--surface)}
.ia-sugg:empty{display:none}
.ia-sugg:empty+.ia-saisie{border-top:1px solid var(--line)}
.ia-saisie textarea{flex:1;min-width:0;min-height:44px;max-height:130px;resize:none}
/* la fiche occupe la droite de l'écran : l'agent se place à côté, pour garder le bouton Enregistrer visible */
@media (min-width:1001px){dialog.drawer>#dock{right:calc(min(580px,100vw) + 16px)}dialog.drawer>#toast{left:18px;transform:none;max-width:min(520px,calc(100vw - 840px))}}
@media (max-width:1000px){dialog.drawer>#dock{bottom:76px}dialog.drawer>#dock .ia-panel{height:min(580px,calc(100dvh - 170px))}dialog.drawer>#toast{bottom:136px}}
@media (max-width:560px){#toast{bottom:84px}.tabs{flex-wrap:wrap}.tab{padding:6px 10px}}

/* ---------- réglages ---------- */
.sous-onglets{display:flex;gap:4px;margin:0 0 16px;border-bottom:1px solid var(--line-strong);padding-bottom:8px}
.reglages{display:grid;gap:18px;max-width:680px;padding:20px;background:var(--surface);border-radius:12px}
.reglages h3{font-size:19px}
.reglages .boutons{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.reglages .etat{font-weight:700}
.reglages .etat.ok{color:var(--valide)}
.reglages .etat.ko{color:var(--refuse)}
</style>

const toIso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromIso = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayIso = () => toIso(new Date());
const addDays = (iso, n) => { const d = fromIso(iso); d.setDate(d.getDate() + n); return toIso(d); };
const diffDays = (a, b) => Math.round((fromIso(b) - fromIso(a)) / 86400000);
const weekday = (iso) => (fromIso(iso).getDay() + 6) % 7; // 0 = lundi
const dayNum = (iso) => Number(iso.slice(8));
const monthIdx = (iso) => Number(iso.slice(5, 7)) - 1;
const jourMois = (iso) => `${dayNum(iso) === 1 ? '1er' : dayNum(iso)} ${MOIS[monthIdx(iso)]}`;
const dateLongue = (iso) => `${jourMois(iso)} ${iso.slice(0, 4)}`;
const dateAvecJour = (iso) => `${JOURS_COURTS[weekday(iso)]} ${dateLongue(iso)}`;
function periode(a, b) {
  if (!b || a === b) return dateLongue(a);
  const [y1, y2] = [a.slice(0, 4), b.slice(0, 4)];
  const j = (iso) => (dayNum(iso) === 1 ? '1er' : dayNum(iso));
  if (y1 === y2 && monthIdx(a) === monthIdx(b)) return `du ${j(a)} au ${j(b)} ${MOIS[monthIdx(b)]} ${y2}`;
  if (y1 === y2) return `du ${jourMois(a)} au ${jourMois(b)} ${y2}`;
  return `du ${dateLongue(a)} au ${dateLongue(b)}`;
}
const heureFr = (h) => (h ? h.replace(':', 'h') : '');
const listeFr = (a) => (a.length < 2 ? a.join('') : `${a.slice(0, -1).join(', ')} et ${a[a.length - 1]}`);
const titreMois = (ym) => `${MOIS[Number(ym.slice(5)) - 1][0].toUpperCase()}${MOIS[Number(ym.slice(5)) - 1].slice(1)} ${ym.slice(0, 4)}`;
const shiftMonth = (ym, n) => { const d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5)) - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };

/* ================= réseau ================= */
let token = '';
try { token = localStorage.getItem('calendy-token') || ''; } catch { /* stockage indisponible */ }

const banner = (show) => { $('#banner').hidden = !show; };

let tokenPromise = null;
function askToken(refused) {
  if (tokenPromise) return tokenPromise;
  tokenPromise = new Promise((resolve) => {
    const dlg = $('#tokenDlg');
    dlg.innerHTML = `<form class="modal-form">
      <header class="modal-head"><h2 id="dlgTitle">Accès protégé</h2></header>
      <p>Saisis le jeton d’accès de Calendy (la valeur de CALENDY_TOKEN sur le serveur).</p>
      ${refused ? '<p class="form-error" role="alert">Ce jeton est refusé. Vérifie-le et réessaie.</p>' : ''}
      <label class="f"><span>Jeton d’accès</span><input type="password" name="token" autocomplete="current-password" required></label>
      <div class="modal-foot"><button class="btn primary" type="submit">Se connecter</button></div></form>`;
    dlg.querySelector('form').addEventListener('submit', (e) => {
      e.preventDefault();
      token = String(new FormData(e.target).get('token')).trim();
      try { localStorage.setItem('calendy-token', token); } catch { /* ignoré */ }
      tokenPromise = null;
      dlg.close();
      resolve();
    });
    dlg.showModal();
  });
  return tokenPromise;
}

async function request(method, path, body) {
  const headers = {};
  if (token) headers.Authorization = `Bearer ${token}`;
  const brut = body instanceof Blob; // photo : on envoie l'image telle quelle
  if (body !== undefined) headers['Content-Type'] = brut ? body.type : 'application/json';
  let res;
  try {
    res = await fetch(path, { method, headers, body: body === undefined ? undefined : brut ? body : JSON.stringify(body) });
  } catch {
    banner(true);
    throw new Error('Serveur injoignable.');
  }
  banner(false);
  if (res.status === 401) {
    await askToken(Boolean(token));
    return request(method, path, body);
  }
  return res;
}

async function api(method, path, body) {
  const res = await request(method, path, body);
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error((data && data.error) || `Erreur ${res.status}`);
  return data;
}

async function refresh() {
  const data = await api('GET', '/api/state');
  const sig = JSON.stringify([data.evenements, data.posts, data.structure]);
  state.loaded = true;
  state.historique = data.historique || state.historique;
  majHistorique();
  majStructure(data.structure || '');
  if (sig === state.sig && state.rendered) return;
  state.sig = sig;
  state.evenements = data.evenements;
  state.posts = data.posts;
  render();
}

/* ================= message flottant ================= */
let toastTimer = 0;
function toast(message, { undo = null, error = false } = {}) {
  const el = $('#toast');
  clearTimeout(toastTimer);
  el.className = error ? 'error' : '';
  el.innerHTML = `<span>${esc(message)}</span>${undo ? '<button type="button" data-action="undo">Annuler</button>' : ''}`;
  el.hidden = false;
  el._undo = undo;
  toastTimer = setTimeout(() => { el.hidden = true; el._undo = null; }, error ? 9000 : 7000);
}

async function guard(fn) {
  try { await fn(); } catch (err) { toast(err.message || 'Une erreur est survenue.', { error: true }); }
}

/* ================= photos ================= */
// Des images facultatives par visuel : Instagram et Facebook partagent les mêmes, LinkedIn a les siennes.
// Plusieurs images sur un même visuel forment un carrousel, dans l'ordre choisi.
const SLOTS = { meta: { titre: 'Instagram + Facebook', reseaux: ['Instagram', 'Facebook'] }, linkedin: { titre: 'LinkedIn', reseaux: ['LinkedIn'] } };
const PHOTOS_MAX = 20; // même limite que le serveur
const photoCache = new Map();
/** Images d'un visuel, dans l'ordre (accepte aussi l'ancien format : une seule photo, ou aucune). */
const listePhotos = (p, slot) => {
  const v = p && p.photos && p.photos[slot];
  return Array.isArray(v) ? v : v ? [v] : [];
};
const nbPhotos = (p) => Object.keys(SLOTS).reduce((n, s) => n + listePhotos(p, s).length, 0);
const hasPhoto = (p) => nbPhotos(p) > 0;

// Les images sont protégées par le jeton : on les télécharge avec l'en-tête puis on les affiche via une URL locale.
function photoUrl(id, slot, fichier) {
  if (!fichier) { const f = listePhotos(postById(id), slot)[0]; fichier = f && f.fichier; }
  if (!fichier) return Promise.resolve('');
  const key = `${id}/${slot}/${fichier}`;
  if (!photoCache.has(key)) {
    photoCache.set(key, request('GET', `/api/posts/${id}/photo/${slot}/${encodeURIComponent(fichier)}`)
      .then(async (res) => { if (!res.ok) throw new Error('photo'); return URL.createObjectURL(await res.blob()); })
      .catch(() => { photoCache.delete(key); return ''; }));
  }
  return photoCache.get(key);
}

function hydratePhotos(root = document) {
  root.querySelectorAll('img[data-photo]:not([src])').forEach(async (img) => {
    const url = await photoUrl(img.dataset.photo, img.dataset.slot, img.dataset.fichier);
    if (url && img.isConnected) img.src = url;
  });
}

/** Enrobe une image dans un bouton : un clic (ou Entrée au clavier) l'ouvre en grand. */
const zoomPhoto = (imgHtml, slot, numero = 1, total = 1) =>
  `<button type="button" class="ph-zoom" data-action="photo-zoom" aria-label="${total > 1 ? `Agrandir l’image ${numero} sur ${total} (${esc(SLOTS[slot].titre)})` : `Agrandir la photo ${esc(SLOTS[slot].titre)}`}">${imgHtml}${icon('i-zoom')}</button>`;

/* Affichage en grand. Les images d'un même carrousel (conteneur data-gal) se parcourent avec les flèches de l'écran ou du clavier. */
const lightbox = { images: [], i: 0 };

function ouvrirPhoto(img) {
  const src = img && img.getAttribute('src');
  if (!src) return; // l'image n'est pas encore chargée
  const gal = img.closest('[data-gal]');
  const liste = gal ? [...gal.querySelectorAll('.ph-zoom img[src]')] : [img];
  lightbox.images = liste.map((el) => ({ src: el.getAttribute('src'), alt: el.alt }));
  lightbox.i = Math.max(0, liste.indexOf(img));
  afficherLightbox(true);
  $('#photoDlg').showModal();
}

function afficherLightbox(complet) {
  const { images, i } = lightbox;
  const { src, alt } = images[i];
  const multi = images.length > 1;
  const legende = multi ? `Image ${i + 1} sur ${images.length}. ${alt}` : alt;
  const fig = `<figure class="lb-fig" data-action="close-dialog"><img src="${esc(src)}" alt="${esc(alt)}"><figcaption id="photoCap">${esc(legende)}</figcaption></figure>`;
  const dlg = $('#photoDlg');
  if (complet) {
    dlg.innerHTML = `<button type="button" class="icon-btn lb-close" data-action="close-dialog" aria-label="Fermer l’image">${icon('i-x')}</button>
      ${multi ? '<button type="button" class="icon-btn lb-nav lb-prev" data-action="photo-prev" aria-label="Image précédente">‹</button><button type="button" class="icon-btn lb-nav lb-next" data-action="photo-next" aria-label="Image suivante">›</button>' : ''}
      ${fig}`;
  } else {
    dlg.querySelector('.lb-fig').outerHTML = fig;
  }
}

function lightboxStep(delta) {
  const n = lightbox.images.length;
  if (n < 2) return;
  lightbox.i = (lightbox.i + delta + n) % n;
  afficherLightbox(false);
}

const altPhoto = (p, slot) => `Photo prévue pour ${listeFr(SLOTS[slot].reseaux)} : ${p.titre}`;

/** Les images jointes à un post (carte « À valider » et fiche) : une photo seule en grand, un carrousel en vignettes numérotées. */
function photosHtml(p) {
  const figs = Object.keys(SLOTS).filter((s) => listePhotos(p, s).length).map((s) => {
    const liste = listePhotos(p, s);
    const n = liste.length;
    const vignettes = liste.map((f, i) =>
      `<div class="ph-thumb">${zoomPhoto(`<img data-photo="${esc(p.id)}" data-slot="${s}" data-fichier="${esc(f.fichier)}" alt="${esc(altPhoto(p, s))}">`, s, i + 1, n)}${n > 1 ? `<span class="ph-num" aria-hidden="true">${i + 1}</span>` : ''}</div>`).join('');
    const legende = n > 1 ? `Carrousel ${SLOTS[s].titre} : ${n} images` : `Photo ${SLOTS[s].titre}`;
    return `<figure class="ph-fig${n > 1 ? ' ph-car' : ''}" data-gal><div class="ph-strip">${vignettes}</div><figcaption>${esc(legende)}</figcaption>${boutonTelecharger(p.id, s, false, n)}</figure>`;
  });
  return figs.length ? `<div class="ph-row">${figs.join('')}</div>` : '';
}

const libelleTelecharger = (slot, n) => (n > 1 ? `Télécharger les ${n} images ${SLOTS[slot].titre}` : `Télécharger la photo ${SLOTS[slot].titre}`);
const boutonTelecharger = (id, slot, hidden = false, n = 1) =>
  `<button type="button" class="btn small" data-action="photo-download" data-id="${esc(id)}" data-slot="${slot}" aria-label="${esc(libelleTelecharger(slot, n))}"${hidden ? ' hidden' : ''}>${icon('i-down')}<span>${n > 1 ? `Télécharger les ${n} images` : 'Télécharger'}</span></button>`;

/** Nom de fichier lisible pour une image téléchargée : 2026-11-23_titre-du-post_instagram-facebook.jpg (puis _1, _2… pour un carrousel). */
function nomFichierPhoto(p, slot, i = 0, n = 1) {
  const slug = String(p.titre || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').slice(0, 60).replace(/^-+|-+$/g, '') || 'post';
  const image = listePhotos(p, slot)[i];
  const ext = image && image.type === 'image/png' ? 'png' : 'jpg';
  return `${p.datePublication}_${slug}_${slot === 'meta' ? 'instagram-facebook' : 'linkedin'}${n > 1 ? `_${i + 1}` : ''}.${ext}`;
}

/** Enregistre sur l'appareil les images jointes à un post, telles qu'elles sont stockées dans Calendy (pas besoin de repasser par Canva). */
async function downloadPhoto(id, slot) {
  const p = postById(id);
  const liste = listePhotos(p, slot);
  if (!liste.length) throw new Error('Ce post n’a pas de photo pour ce réseau.');
  const noms = [];
  for (const [i, f] of liste.entries()) {
    const url = await photoUrl(id, slot, f.fichier);
    if (!url) throw new Error(liste.length > 1 ? `L’image ${i + 1} n’a pas pu être récupérée sur le serveur.` : 'La photo n’a pas pu être récupérée sur le serveur.');
    const name = nomFichierPhoto(p, slot, i, liste.length);
    const a = Object.assign(document.createElement('a'), { href: url, download: name });
    document.body.append(a);
    a.click();
    a.remove();
    noms.push(name);
    if (i < liste.length - 1) await new Promise((r) => setTimeout(r, 350)); // les navigateurs refusent parfois des téléchargements simultanés
  }
  toast(noms.length > 1 ? `${noms.length} images téléchargées.` : `${noms[0]} téléchargée.`);
}

/** Réduit la photo à 1600 px maximum et l'enregistre en JPEG : envoi rapide, fichier Excel raisonnable, rotation du téléphone appliquée. */
async function prepareImage(file) {
  if (!file.type.startsWith('image/')) throw new Error('Ce fichier n’est pas une image.');
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch { throw new Error('Ce format d’image n’est pas lu par le navigateur. Utilise une photo JPEG ou PNG.'); }
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * k));
  const h = Math.max(1, Math.round(bmp.height * k));
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.9));
  if (!blob) throw new Error('Impossible de préparer cette image.');
  return blob;
}

function photoSlotHtml(p, slot) {
  const s = SLOTS[slot];
  const visible = p.plateformes.some((n) => s.reseaux.includes(n));
  return `<div class="ph-slot" data-slot="${slot}"${visible ? '' : ' hidden'}>
      <h4>${esc(s.titre)} <small class="ph-count" data-count></small></h4>
      <div class="ph-box" data-box data-gal></div>
      <div class="ph-actions">
        <button type="button" class="btn small" data-action="photo-pick" data-slot="${slot}">${icon('i-photo')}<span data-pick-label>Ajouter des images</span></button>
        ${boutonTelecharger(p.id, slot, true)}
      </div>
      <input type="file" accept="image/*" multiple data-photo-input="${slot}" hidden>
      <p class="ph-err form-error" role="alert" hidden></p>
    </div>`;
}

// État des images du tiroir : { meta|linkedin: { items, base } }, appliqué à l'enregistrement.
//  - items : la liste ordonnée voulue, avec des images déjà enregistrées ({ fichier }) et de nouvelles ({ blob, url }) ;
//  - base : les fichiers enregistrés à l'ouverture du tiroir (pour ne retirer que ce que l'utilisateur a vraiment retiré).
function photoSlotRefresh(form, slot) {
  const el = form.querySelector(`.ph-slot[data-slot=${slot}]`);
  const st = $('#drawer')._photos[slot];
  const id = form.dataset.id;
  const n = st.items.length;
  const titre = SLOTS[slot].titre;
  const box = el.querySelector('[data-box]');
  if (!n) {
    box.className = 'ph-box';
    box.innerHTML = '<span>Aucune image</span>';
  } else {
    box.className = 'ph-list';
    box.innerHTML = st.items.map((it, i) => {
      const img = it.blob
        ? `<img src="${esc(it.url)}" alt="Nouvelle image pour ${esc(titre)}">`
        : `<img data-photo="${esc(id)}" data-slot="${slot}" data-fichier="${esc(it.fichier)}" alt="Image enregistrée pour ${esc(titre)}">`;
      return `<div class="ph-item" data-i="${i}">
        <div class="ph-thumb">${zoomPhoto(img, slot, i + 1, n)}<span class="ph-num" aria-hidden="true">${i + 1}</span></div>
        <div class="ph-tools" role="group" aria-label="Image ${i + 1} sur ${n}">
          <button type="button" class="btn small" data-action="photo-move" data-slot="${slot}" data-i="${i}" data-dir="-1" aria-label="Avancer l’image ${i + 1} (la placer avant)"${i === 0 ? ' disabled' : ''}>←</button>
          <button type="button" class="btn small" data-action="photo-move" data-slot="${slot}" data-i="${i}" data-dir="1" aria-label="Reculer l’image ${i + 1} (la placer après)"${i === n - 1 ? ' disabled' : ''}>→</button>
          <button type="button" class="btn small danger" data-action="photo-remove" data-slot="${slot}" data-i="${i}" aria-label="Retirer l’image ${i + 1}">${icon('i-x')}</button>
        </div></div>`;
    }).join('');
    hydratePhotos(box);
  }
  el.querySelector('[data-count]').textContent = n > 1 ? `(carrousel de ${n} images)` : n === 1 ? '(1 image)' : '';
  el.querySelector('[data-pick-label]').textContent = n ? 'Ajouter d’autres images' : 'Ajouter des images';
  el.querySelector('[data-action=photo-pick]').disabled = n >= PHOTOS_MAX;
  // Seules les images déjà enregistrées se téléchargent (celles qui viennent d'être choisies sont déjà sur l'appareil).
  const enregistrees = listePhotos(postById(id), slot).length;
  const dl = el.querySelector('[data-action=photo-download]');
  dl.hidden = !enregistrees;
  dl.setAttribute('aria-label', libelleTelecharger(slot, enregistrees));
  dl.querySelector('span').textContent = enregistrees > 1 ? `Télécharger les ${enregistrees} images` : 'Télécharger';
}

function photoSlotsSync(form) {
  const nets = [...form.querySelectorAll('input[name=plateformes]:checked')].map((i) => i.value);
  form.querySelectorAll('.ph-slot').forEach((el) => { el.hidden = !SLOTS[el.dataset.slot].reseaux.some((n) => nets.includes(n)); });
}

async function photoChosen(input) {
  const form = input.closest('form');
  const slot = input.dataset.photoInput;
  const err = form.querySelector(`.ph-slot[data-slot=${slot}] .ph-err`);
  const files = [...(input.files || [])];
  input.value = '';
  if (!files.length) return;
  err.hidden = true;
  const drawer = $('#drawer');
  const st = drawer._photos[slot];
  const places = Math.max(0, PHOTOS_MAX - st.items.length);
  const messages = [];
  if (files.length > places) {
    const trop = files.length - places;
    messages.push(`Maximum ${PHOTOS_MAX} images par visuel : ${trop} image${trop > 1 ? 's n’ont pas été ajoutées' : ' n’a pas été ajoutée'}.`);
  }
  let ajoutees = 0;
  for (const file of files.slice(0, places)) {
    try {
      const blob = await prepareImage(file);
      st.items.push({ blob, url: URL.createObjectURL(blob) });
      ajoutees += 1;
    } catch (e) {
      messages.push(files.length > 1 ? `${file.name} : ${e.message}` : e.message);
    }
  }
  if (!form.isConnected) return; // le tiroir a été fermé pendant la préparation des images
  if (ajoutees) drawer._dirty = true;
  photoSlotRefresh(form, slot);
  if (messages.length) {
    err.textContent = messages.join(' ');
    err.hidden = false;
  }
}

function photoRemoved(form, slot, i) {
  const st = $('#drawer')._photos[slot];
  const [retiree] = st.items.splice(i, 1);
  if (retiree && retiree.url) URL.revokeObjectURL(retiree.url);
  $('#drawer')._dirty = true;
  photoSlotRefresh(form, slot);
  const el = form.querySelector(`.ph-slot[data-slot=${slot}]`);
  const suivant = el.querySelector(`.ph-item[data-i="${Math.min(i, st.items.length - 1)}"] [data-action=photo-remove]`);
  (suivant || el.querySelector('[data-action=photo-pick]')).focus();
}

function photoMoved(form, slot, i, dir) {
  const items = $('#drawer')._photos[slot].items;
  const j = i + dir;
  if (j < 0 || j >= items.length) return;
  [items[i], items[j]] = [items[j], items[i]];
  $('#drawer')._dirty = true;
  photoSlotRefresh(form, slot);
  // Le focus suit l'image déplacée, pour pouvoir continuer à la déplacer au clavier.
  const el = form.querySelector(`.ph-slot[data-slot=${slot}] .ph-item[data-i="${j}"]`);
  const bouton = el && (el.querySelector(`[data-action=photo-move][data-dir="${dir}"]:not(:disabled)`) || el.querySelector('[data-action=photo-move]:not(:disabled)'));
  if (bouton) bouton.focus();
}

const messageErreur = async (res) => ((await res.json().catch(() => null)) || {}).error || `erreur ${res.status}`;

/**
 * Applique à l'enregistrement les changements d'images faits dans le tiroir : retire ce qui a été retiré, envoie les nouvelles
 * images à la suite, puis remet le tout dans l'ordre choisi. `saved` est le post tel que le serveur vient de l'enregistrer.
 */
async function applyPhotos(id, photos, reseaux, saved) {
  for (const slot of Object.keys(SLOTS)) {
    if (!SLOTS[slot].reseaux.some((n) => reseaux.includes(n))) continue; // visuel masqué : on ne touche à rien
    const { items, base } = photos[slot];
    const route = `/api/posts/${id}/photo/${slot}`;
    const gardees = new Set(items.filter((it) => it.fichier).map((it) => it.fichier));
    let courant = listePhotos(saved, slot).map((f) => f.fichier); // ce que le serveur a à cet instant
    // 1. Retirer les images que l'utilisateur a retirées, et seulement celles-là : une image ajoutée entre-temps ailleurs reste.
    for (const f of base) {
      if (gardees.has(f) || !courant.includes(f)) continue;
      const res = await request('DELETE', `${route}/${encodeURIComponent(f)}`);
      if (!res.ok && res.status !== 404) throw new Error(await messageErreur(res));
      courant = courant.filter((x) => x !== f);
    }
    // 2. Envoyer les nouvelles images, à la suite.
    const voulu = [];
    for (const it of items) {
      if (it.fichier) {
        if (courant.includes(it.fichier)) voulu.push(it.fichier);
        continue;
      }
      const res = await request('POST', route, it.blob);
      if (!res.ok) throw new Error(await messageErreur(res));
      const liste = listePhotos(await res.json(), slot);
      const nouvelle = liste[liste.length - 1].fichier;
      courant.push(nouvelle);
      voulu.push(nouvelle);
    }
    // 3. Remettre dans l'ordre choisi (une image ajoutée ailleurs entre-temps passe à la fin).
    const ordre = [...voulu, ...courant.filter((f) => !voulu.includes(f))];
    if (ordre.join('|') !== courant.join('|')) await api('PUT', `${route}/ordre`, { fichiers: ordre });
  }
}

/* ---- calendrier ---- */
function assignLanes(events, gridStart, gridEnd) {
  const visible = events
    .filter((e) => e.dateFin >= gridStart && e.dateDebut <= gridEnd)
    .sort((a, b) => a.dateDebut.localeCompare(b.dateDebut) || b.dateFin.localeCompare(a.dateFin) || a.nom.localeCompare(b.nom));
  const ends = [];
  const lanes = new Map();
  for (const e of visible) {
    const start = e.dateDebut < gridStart ? gridStart : e.dateDebut;
    let i = ends.findIndex((end) => end < start);
    if (i < 0) { i = ends.length; ends.push(''); }
    ends[i] = e.dateFin > gridEnd ? gridEnd : e.dateFin;
    lanes.set(e.id, i);
  }
  return { visible, lanes, count: ends.length };
}

function laneHtml(iso, col, rowEnd, ctx) {
  let out = '';
  for (let lane = 0; lane < ctx.count; lane++) {
    const ev = ctx.visible.find((e) => ctx.lanes.get(e.id) === lane && e.dateDebut <= iso && e.dateFin >= iso);
    if (!ev) { out += '<div class="lane"></div>'; continue; }
    const start = ev.dateDebut === iso;
    const end = ev.dateFin === iso;
    const showLabel = start || col === 0;
    const n = diffDays(iso, ev.dateFin < rowEnd ? ev.dateFin : rowEnd) + 1;
    const cls = `bar${start ? ' start' : ''}${end ? ' end' : ''}`;
    const lbl = showLabel ? `<span class="lbl" style="width:calc(${n * 100}% + ${n - 1}px - ${start ? 20 : 14}px)">${escBr(ev.nom)}</span>` : '';
    out += showLabel
      ? `<div class="lane"><button type="button" class="${cls}" data-action="edit-event" data-id="${esc(ev.id)}" title="${esc(`${ev.nom}, ${periode(ev.dateDebut, ev.dateFin)}`)}" aria-label="${esc(`Événement ${ev.nom}, ${periode(ev.dateDebut, ev.dateFin)}`)}">${lbl}</button></div>`
      : `<div class="lane"><span class="${cls}" data-action="edit-event" data-id="${esc(ev.id)}" aria-hidden="true"></span></div>`;
  }
  return out;
}

/* grille d’un mois : `garde` choisit les posts affichés, `ajout` montre le bouton + de chaque jour */
function gridCells(ym, garde, ajout) {
  const [y, m] = ym.split('-').map(Number);
  const first = `${ym}-01`;
  const offset = weekday(first);
  const weeks = Math.ceil((offset + new Date(y, m, 0).getDate()) / 7);
  const gridStart = addDays(first, -offset);
  const last = `${ym}-${pad(new Date(y, m, 0).getDate())}`;
  // Seuls les événements qui touchent le mois sont dessinés, et chaque semaine ne réserve que les lignes dont elle a besoin.
  const evs = state.evenements.filter((e) => e.dateFin >= first && e.dateDebut <= last);
  const today = todayIso();
  let cells = JOURS.map((j) => `<div class="dow">${j}</div>`).join('');
  let ctx = null;
  for (let i = 0; i < weeks * 7; i++) {
    const iso = addDays(gridStart, i);
    const col = i % 7;
    if (col === 0) ctx = assignLanes(evs, iso, addDays(iso, 6));
    const posts = state.posts.filter((p) => p.datePublication === iso && garde(p)).sort(parHeure);
    const label = dayNum(iso) === 1 ? `1 ${MOIS_COURTS[monthIdx(iso)]}` : dayNum(iso);
    cells += `<div class="day${iso.startsWith(ym) ? '' : ' out'}${col >= 5 ? ' weekend' : ''}${iso === today ? ' today' : ''}" data-date="${iso}">
      <div class="day-head"><span class="dn" ${iso === today ? 'aria-label="Aujourd’hui"' : ''}>${label}</span>
        ${ajout ? `<button type="button" class="add" data-action="${ajout === 'evenement' ? 'new-event' : 'new-post'}" data-date="${iso}" aria-label="Ajouter ${ajout === 'evenement' ? 'un événement' : 'un post'} le ${esc(dateLongue(iso))}">${icon('i-plus')}</button>` : ''}</div>
      <div class="lanes">${laneHtml(iso, col, addDays(iso, 6 - col), ctx)}</div>
      <div class="day-posts">${posts.map((p) => `<div class="chip-wrap" draggable="true" data-id="${esc(p.id)}">${chip(p)}</div>`).join('')}</div></div>`;
  }
  return cells;
}

const dndHint = () => '<p class="hint dnd-hint">Glisse un post sur un autre jour pour le déplacer ; garde Ctrl enfoncé (Option sur Mac) pour le cloner.</p>';

function calendarView() {
  const ym = state.month;
  const monthPosts = state.posts.filter((p) => p.datePublication.startsWith(ym));

  const filters = ORDRE.map((s) => {
    const n = monthPosts.filter((p) => p.statut === s).length;
    return `<button type="button" class="filter s-${s}" data-action="toggle-statut" data-statut="${s}" aria-pressed="${!state.hidden.has(s)}">${icon(ICONES[s])}${STATUTS[s]} <span class="n">${n}</span></button>`;

  const empty = monthPosts.length === 0
    ? `<div class="empty"><strong>Aucun post en ${esc(titreMois(ym).toLowerCase())}.</strong><p>Ajoute un post sur un jour du calendrier, ou propose des idées depuis Claude Desktop.</p><button class="btn primary" data-action="new-post">${icon('i-plus')}Nouveau post</button></div>`
    : '';

  return `<div class="cal-bar">

function agendaHtml(ym, garde = (p) => !state.hidden.has(p.statut)) {
  const days = [...new Set(state.posts.filter((p) => p.datePublication.startsWith(ym) && garde(p)).map((p) => p.datePublication))].sort();
  const first = `${ym}-01`;
  const last = `${ym}-${pad(new Date(Number(ym.slice(0, 4)), Number(ym.slice(5)), 0).getDate())}`;
  const evs = state.evenements.filter((e) => e.dateFin >= first && e.dateDebut <= last);
  const evHtml = evs.length
    ? `<div class="ag-events">${evs.map((e) => `<button type="button" class="ag-ev" data-action="edit-event" data-id="${esc(e.id)}"><strong>${escBr(e.nom)}</strong><small>${esc(periode(e.dateDebut, e.dateFin))}</small></button>`).join('')}</div>`
    : '';
  const dayHtml = days.map((iso) => `<section class="ag-day"><div class="cdate"><span class="n">${dayNum(iso)}</span><small>${JOURS_COURTS[weekday(iso)]}</small></div>
    <div class="ag-posts">${state.posts.filter((p) => p.datePublication === iso && garde(p)).sort(parHeure).map(chip).join('')}</div></section>`).join('');
  return `<div class="agenda">${evHtml}${dayHtml}</div>`;
}

/* ---- à valider ---- */
function validateView() {
  const ideas = state.posts.filter((p) => p.statut === 'idee').sort((a, b) => a.datePublication.localeCompare(b.datePublication) || parHeure(a, b));
  if (!ideas.length) {
    return `<div class="empty"><strong>Tout est décidé.</strong><p>Aucun post n’attend de validation pour le moment.</p><button class="btn primary" data-action="new-post">${icon('i-plus')}Nouveau post</button></div>`;
  }
  const today = todayIso();
  const parMois = new Map();
  for (const p of ideas) {
    const ym = p.datePublication.slice(0, 7);
    if (!parMois.has(ym)) parMois.set(ym, []);
    parMois.get(ym).push(p);
  }
  const carte = (p) => {
    const ev = p.eventId ? evById(p.eventId) : null;
    const past = p.datePublication < today;
    return `<article class="card idea${past ? ' past' : ''}" aria-labelledby="t-${esc(p.id)}">
      <div class="cdate"><small>${JOURS_COURTS[weekday(p.datePublication)]}</small><span class="n">${dayNum(p.datePublication)}</span><small>${MOIS_COURTS[monthIdx(p.datePublication)]}</small></div>
      <div>
        <h3 id="t-${esc(p.id)}">${escBr(p.titre)}${past ? '<span class="tag-past">Date passée</span>' : ''}</h3>
        <p class="meta"><span class="nets">${p.plateformes.map(badgeReseau).join('')}</span>${p.heure ? `${heureFr(p.heure)} sur ` : 'Sur '}${esc(listeFr(p.plateformes))}${p.atelier ? `. Atelier : ${escBr(p.atelier)}` : ''}</p>
        ${p.description ? `<p class="legende">${escBr(p.description)}</p>` : ''}
        ${p.hashtags ? `<p class="tags">${escBr(p.hashtags)}</p>` : ''}
        ${photosHtml(p)}
        <dl class="facts">
          ${p.imageIdee ? `<div><dt>Visuel</dt><dd>${escBr(p.imageIdee)}</dd></div>` : ''}
          ${p.angle ? `<div><dt>Angle</dt><dd>${escBr(p.angle)}</dd></div>` : ''}
          ${ev ? `<div class="evnote"><p><strong>${escBr(ev.nom)}</strong>, ${esc(periode(ev.dateDebut, ev.dateFin))}</p>${ev.explication ? `<p>${escBr(ev.explication)}</p>` : ''}${ev.lienElisa30 ? `<p>${escBr(ev.lienElisa30)}</p>` : ''}</div>` : ''}
          ${p.vigilance ? `<div class="alert">${icon('i-warn')}<p><strong>À vérifier avant de publier.</strong> ${escBr(p.vigilance)}</p></div>` : ''}
        </dl>
      </div>
      <div class="actions">
        <button class="btn ok" data-action="set-statut" data-id="${esc(p.id)}" data-statut="valide">${icon('i-check')}Valider</button>
        <button class="btn no" data-action="set-statut" data-id="${esc(p.id)}" data-statut="refuse">${icon('i-x')}Refuser</button>
        <button class="btn" data-action="edit-post" data-id="${esc(p.id)}">Modifier</button>
      </div></article>`;
  };
  // Un seul mois affiché à la fois ; « Tous » pour tout voir. Par défaut : le mois en cours ou le prochain mois qui a des idées.
  const mois = [...parMois.keys()];
  const cal = state.valVue === 'calendrier';
  if ((state.valMois !== 'all' || cal) && !parMois.has(state.valMois)) {
    state.valMois = mois.find((ym) => ym >= today.slice(0, 7)) || mois[mois.length - 1];
  }
  const chip = (ym, label, nb) => `<button type="button" class="mois-chip" data-action="choisir-mois" data-mois="${esc(ym)}" aria-pressed="${state.valMois === ym}">${esc(label)}<span class="n">${nb}</span></button>`;
  const vues = vueToggle('val', state.valVue);
  const filtre = `<div class="val-bar"><nav class="mois-filtre" aria-label="Choisir le mois des propositions">${mois.map((ym) => chip(ym, titreMois(ym), parMois.get(ym).length)).join('')}${mois.length > 1 && !cal ? chip('all', 'Tous les mois', ideas.length) : ''}</nav>${vues}</div>`;
  if (cal) {
    const garde = (p) => p.statut === 'idee';
    return `${filtre}${dndHint()}<div class="grid" role="presentation">${gridCells(state.valMois, garde, false)}</div>${agendaHtml(state.valMois, garde)}`;
  }
  const affiches = state.valMois === 'all' ? [...parMois] : [[state.valMois, parMois.get(state.valMois)]];
  const corps = state.valMois === 'all'
    ? affiches.map(([ym, ps]) => moisSection('valider', ym, ps.length, ps.map(carte).join(''), 'idée')).join('')
    : `<div class="list">${affiches[0][1].map(carte).join('')}</div>`;
  return filtre + corps;
}

  };

    const ym = state.evMois;
    const nb = evs.filter((e) => e.dateFin >= `${ym}-01` && e.dateDebut <= `${ym}-31`).length;

/** Champs marqués data-hl : le texte [entre crochets] est surligné pendant la saisie, grâce à une copie invisible placée derrière le champ. */
function initHighlights(root) {
  for (const f of root.querySelectorAll('[data-hl]')) {
    if (f.parentElement.classList.contains('hl-wrap')) continue;
    const multi = f.tagName === 'TEXTAREA';
    const wrap = document.createElement('div');
    wrap.className = 'hl-wrap';
    const back = document.createElement('div');
    back.className = `hl-back ${multi ? 'ta' : 'one'}`;
    back.setAttribute('aria-hidden', 'true');
    f.before(wrap);
    wrap.append(back, f);
    f.classList.add('hl-field');
    const paint = () => {
      back.innerHTML = escBr(f.value) + (multi ? '\n' : '');
      // la barre de défilement du champ réduit sa largeur utile : la copie doit passer à la ligne au même endroit
      const cs = getComputedStyle(f);
      const barre = f.offsetWidth - f.clientWidth - parseFloat(cs.borderLeftWidth) - parseFloat(cs.borderRightWidth);
      back.style.paddingRight = `${11 + Math.max(0, barre || 0)}px`;
      back.scrollTop = f.scrollTop;
      back.scrollLeft = f.scrollLeft;
    };
    f.addEventListener('input', paint);
    f.addEventListener('scroll', () => { back.scrollTop = f.scrollTop; back.scrollLeft = f.scrollLeft; });
    new ResizeObserver(paint).observe(f);
    paint();
  }
}

/** Sous le statut : explique la planification et prévient si la date choisie est déjà passée. */
function updatePlanifHint(form) {
  const el = form.querySelector('#planifHint');
  if (!el) return;
  const statut = form.elements.statut.value;
  const date = form.elements.datePublication.value;
  const heure = form.elements.heure.value;
  el.className = 'hint';
  if (statut !== 'planifie') {
    el.textContent = 'Choisis « Planifié » pour que le post passe tout seul en « Publié » à la date et à l’heure prévues.';
    return;
  }
  if (!date) { el.textContent = 'Choisis d’abord une date de publication.'; return; }
  const maintenant = new Date();
  const hm = `${pad(maintenant.getHours())}:${pad(maintenant.getMinutes())}`;
  const aujourdhui = todayIso();
  const passe = date < aujourdhui || (date === aujourdhui && (!heure || heure <= hm));
  if (passe) {
    el.className = 'hint over';
    el.textContent = 'Cette date et cette heure sont déjà passées : choisis une date à venir, ou le statut « Publié ».';
    return;
  }
  el.textContent = `Le post passera automatiquement en « Publié » le ${dateLongue(date)}${heure ? ` à ${heureFr(heure)}` : ', dès le début de la journée'}. Calendy ne publie rien sur les réseaux : il met seulement le statut à jour.`;
}

function updateCount(form) {
  const el = form.querySelector('#count');
  if (!el) return;
  const get = (n) => form.elements[n].value.trim();
  const texte = get('description') + (get('hashtags') ? `\n\n${get('hashtags')}` : '');
  const nets = [...form.querySelectorAll('input[name=plateformes]:checked')].map((i) => i.value);
  const depasse = nets.filter((n) => LIMITES[n] && texte.length > LIMITES[n]);
  el.className = `count${depasse.length ? ' over' : ''}`;
  el.textContent = depasse.length
    ? `${texte.length} caractères avec les hashtags : trop long pour ${listeFr(depasse)} (maximum ${listeFr(depasse.map((n) => `${LIMITES[n].toLocaleString('fr-FR')}`))}).`
    : `${texte.length.toLocaleString('fr-FR')} caractères avec les hashtags. Limites : Instagram 2 200, LinkedIn 3 000.`;
}

function openPost(id, defaults = {}) {
  const existing = id ? postById(id) : null;
  const base = existing || { id: '', photos: { meta: [], linkedin: [] }, titre: '', datePublication: defaults.date || (todayIso().startsWith(state.month) ? todayIso() : `${state.month}-01`), heure: '', plateformes: ['Instagram', 'Facebook'], eventId: defaults.eventId || '', description: '', hashtags: '', imageIdee: '', atelier: '', angle: '', vigilance: '', statut: 'idee' };
  const p = { ...base, eventId: base.eventId || '' };
  openDrawer(postForm(p, !existing));
  // Images du tiroir : on part de celles déjà enregistrées (dans l'ordre), l'utilisateur en ajoute, retire, déplace.
  $('#drawer')._photos = Object.fromEntries(Object.keys(SLOTS).map((s) => {
    const fichiers = listePhotos(existing, s).map((f) => f.fichier);
    return [s, { items: fichiers.map((fichier) => ({ fichier })), base: fichiers }];
  }));
  const form = $('#drawer form');
  Object.keys(SLOTS).forEach((s) => photoSlotRefresh(form, s));
  updateCount(form);
  updatePlanifHint(form);
}

/* ================= enregistrement ================= */
function formError(form, message) {
  const el = form.querySelector('.form-error');
  el.textContent = message;
  el.hidden = !message;
  if (message) el.scrollIntoView({ block: 'nearest' });
}

async function submitForm(form) {
  const id = form.dataset.id;
  const fd = new FormData(form);
  const kind = form.dataset.form;
  let payload;
  if (kind === 'post') {
    payload = {
      titre: fd.get('titre'), datePublication: fd.get('datePublication'), heure: fd.get('heure') || '',
      plateformes: fd.getAll('plateformes'), eventId: fd.get('eventId') || null, description: fd.get('description'),
      hashtags: fd.get('hashtags'), imageIdee: fd.get('imageIdee'), atelier: fd.get('atelier'), angle: fd.get('angle'),
      vigilance: fd.get('vigilance'), statut: fd.get('statut'),
    };
  } else {
    payload = { nom: fd.get('nom'), dateDebut: fd.get('dateDebut'), dateFin: fd.get('dateFin') || '', explication: fd.get('explication'), lienElisa30: fd.get('lienElisa30') };
  }
  const base = kind === 'post' ? '/api/posts' : '/api/evenements';
  const btn = form.querySelector('[type=submit]');
  btn.disabled = true;
  try {
    formError(form, '');
    const saved = id ? await api('PUT', `${base}/${id}`, payload) : await api('POST', base, payload);
    let photoErr = '';
    if (kind === 'post') {
      try { await applyPhotos(saved.id, $('#drawer')._photos, payload.plateformes, saved); } catch (e) { photoErr = e.message; }
    }
    $('#drawer')._dirty = false;
    $('#drawer').close();
    await refresh();
    if (kind === 'post' && payload.datePublication) state.month = payload.datePublication.slice(0, 7);
    render();
    if (photoErr) toast(`Post enregistré, mais les images n’ont pas toutes pu être envoyées : ${photoErr}`, { error: true });
    else toast(kind === 'post' ? 'Post enregistré.' : 'Événement enregistré.');
  } catch (err) {
    formError(form, err.message);
    btn.disabled = false;
  }
}

async function deleteCurrent(form) {
  const id = form.dataset.id;
  const kind = form.dataset.form;
  try {
    const res = await api('DELETE', `${kind === 'post' ? '/api/posts' : '/api/evenements'}/${id}`);
    $('#drawer')._dirty = false;
    $('#drawer').close();
    await refresh();
    toast(kind === 'post' ? 'Post supprimé.' : `Événement supprimé${res.postsDetaches ? `, ${res.postsDetaches} post(s) conservé(s) sans événement` : ''}.`, { undo: annulerDernier });
  } catch (err) { formError(form, err.message); }
}

async function setStatut(id, statut) {
  const p = postById(id);
  if (!p) return;
  await api('PUT', `/api/posts/${id}`, { statut });
  await refresh();
  const verbe = { valide: 'validé', planifie: 'planifié', refuse: 'refusé', publie: 'publié', idee: 'remis à valider' }[statut];
  toast(`« ${p.titre.length > 48 ? `${p.titre.slice(0, 47)}…` : p.titre} » ${verbe}.`, { undo: annulerDernier });
}

/* ================= export Excel ================= */
function exportParams(form) {
  const statuts = [...form.querySelectorAll('input[name=statuts]:checked')].map((i) => i.value);
  const mode = form.querySelector('input[name=periode]:checked').value;
  const ym = state.month;
  let du = '';
  let au = '';
  if (mode === 'futur') du = todayIso();
  if (mode === 'mois') { du = `${ym}-01`; au = `${ym}-${pad(new Date(Number(ym.slice(0, 4)), Number(ym.slice(5)), 0).getDate())}`; }
  if (mode === 'dates') { du = form.elements.du.value; au = form.elements.au.value; }
  const photos = form.elements.photos ? form.elements.photos.checked : true;
  return { statuts, du, au, photos };
}

function exportCount(params) {
  return state.posts.filter((p) => params.statuts.includes(p.statut) && (!params.du || p.datePublication >= params.du) && (!params.au || p.datePublication <= params.au)).length;
}

function openExport() {
  const dlg = $('#exportDlg');

    <fieldset><legend>Période</legend>

  const form = dlg.querySelector('form');
  const update = () => {
    form.querySelector('.sub-dates').hidden = form.querySelector('input[name=periode]:checked').value !== 'dates';
    const params = exportParams(form);
    const n = exportCount(params);
    form.querySelector('#exportCount').textContent = n === 0 ? 'Aucun post ne correspond à ces choix.' : `${n} post${n > 1 ? 's' : ''} ${n > 1 ? 'seront exportés' : 'sera exporté'}.`;
    form.querySelector('[type=submit]').disabled = n === 0;
  };
  form.addEventListener('input', update);
  form.addEventListener('submit', (e) => { e.preventDefault(); guard(() => downloadExcel(exportParams(form), dlg)); });
  update();

async function downloadExcel(params, dlg) {
  const q = new URLSearchParams({ statuts: params.statuts.join(',') });
  if (params.du) q.set('du', params.du);
  if (params.au) q.set('au', params.au);
  if (params.photos === false) q.set('photos', '0');
  const res = await request('GET', `/api/export.xlsx?${q}`);
  if (!res.ok) {
    const data = await res.json().catch(() => null);
    throw new Error((data && data.error) || `Export impossible (erreur ${res.status}).`);
  }
  const m = (res.headers.get('Content-Disposition') || '').match(/filename\*=UTF-8''([^;]+)/);
  const name = m ? decodeURIComponent(m[1]) : 'Calendrier_editorial.xlsx';
  const url = URL.createObjectURL(await res.blob());
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  dlg.close();
  toast(`${name} téléchargé.`);
}

/* ================= déplacer, cloner, fusionner ================= */
const titreCourt = (t, n = 48) => (t.length > n ? `${t.slice(0, n - 1)}…` : t);
const reseauxTxt = (p) => listeFr(p.plateformes);

function ouvrirAction(html, { large = false } = {}) {
  const dlg = $('#actionDlg');
  dlg.className = `modal${large ? ' large' : ''}`;
  dlg.innerHTML = html;
  dlg.showModal();
  return dlg;
}

const actionHead = (titre) => `<header class="modal-head"><h2 id="actionTitle">${esc(titre)}</h2><button type="button" class="icon-btn" data-action="close-dialog" aria-label="Fermer">${icon('i-x')}</button></header>`;

function actionErreur(form, message) {
  const el = form.querySelector('.form-error');
  if (!el) return;
  el.textContent = message;
  el.hidden = !message;
}

async function soumettreAction(form, fn) {
  const btn = form.querySelector('[type=submit]');
  btn.disabled = true;
  try {
    actionErreur(form, '');
    await fn();
  } catch (err) {
    actionErreur(form, err.message || 'Une erreur est survenue.');
    btn.disabled = false;
  }
}

// Les modifications non enregistrées de la fiche ne sont pas envoyées avec ces actions : on le dit.
const noteBrouillon = () => ($('#drawer').open && $('#drawer')._dirty ? '<p class="hint">Les modifications non enregistrées de la fiche ne sont pas prises en compte ici.</p>' : '');

/** Après une action : on ferme la fiche et la fenêtre d’action si elles sont ouvertes, puis on recharge le calendrier. */
async function actionTerminee() {
  const drawer = $('#drawer');
  if (drawer.open) { drawer._dirty = false; drawer.close(); }
  const dlg = $('#actionDlg');
  if (dlg.open) dlg.close();
  await refresh();
}

function dansGrille(iso, ym) {
  const first = `${ym}-01`;
  const offset = weekday(first);
  const nbJours = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5)), 0).getDate();
  const debut = addDays(first, -offset);
  const fin = addDays(debut, Math.ceil((offset + nbJours) / 7) * 7 - 1);
  return iso >= debut && iso <= fin;
}

// Si la date n’est pas visible dans le calendrier affiché, on va au bon mois pour que le résultat se voie.
function montrerDate(iso) {
  if (state.view !== 'calendrier' || dansGrille(iso, state.month)) return;
  state.month = iso.slice(0, 7);
  render();
}

  if (!p || p.datePublication === date) return;
  await api('PUT', `/api/posts/${id}`, { datePublication: date });
  await actionTerminee();
  montrerDate(date);
  toast(`« ${titreCourt(p.titre)} » déplacé au ${dateAvecJour(date)}.`, { undo: annulerDernier });
}

/* ---- cloner ---- */
async function clonerVers(id, dates) {
  const p = postById(id);
  const { clones } = await api('POST', `/api/posts/${id}/cloner`, { dates });
  await actionTerminee();
  if (clones.length && !clones.some((c) => dansGrille(c.datePublication, state.month))) montrerDate(clones[0].datePublication);
  const titre = p ? titreCourt(p.titre) : 'post';
  toast(clones.length === 1
    ? `Copie de « ${titre} » créée le ${dateAvecJour(clones[0].datePublication)}, à valider.`
    : `${clones.length} copies de « ${titre} » créées, à valider.`, {
    undo: annulerDernier,
  });
}
