/* ---- fusionner ---- */
const memeReseau = (a, b) => a.plateformes.some((n) => b.plateformes.includes(n));
const motsTitre = (t) => new Set(t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(/[^a-z0-9]+/).filter((w) => w.length > 2));

// Posts qui peuvent être fusionnés avec `p` (aucun réseau en commun), les plus probables d’abord : même jour, titre proche, date proche.
function candidatsFusion(p) {
  const A = motsTitre(p.titre);
  return state.posts
    .filter((q) => q.id !== p.id && !memeReseau(p, q))
    .map((q) => {
      const B = motsTitre(q.titre);
      const commun = [...A].filter((w) => B.has(w)).length;
      const sim = A.size && B.size ? commun / Math.min(A.size, B.size) : 0;
      const jours = Math.abs(diffDays(p.datePublication, q.datePublication));
      return { q, score: (jours === 0 ? 2 : 0) + sim - Math.min(jours, 60) / 100 };
    })
    .sort((x, y) => y.score - x.score || x.q.datePublication.localeCompare(y.q.datePublication))
    .map((x) => x.q);
}

const candidatHtml = (q, coche) => `<label class="cand"><input type="radio" name="autre" value="${esc(q.id)}"${coche ? ' checked' : ''}><span class="cand-body"><strong>${escBr(q.titre)}</strong><small><span>${esc(dateAvecJour(q.datePublication))}</span><span class="nets">${q.plateformes.map(badgeReseau).join('')}</span><span>${esc(STATUTS[q.statut])}</span></small></span></label>`;

// Étape 1 : choisir le second post.
function openFusion(id, choisi = '') {
  const p = postById(id);
  if (!p) return;
  const cands = candidatsFusion(p);
  if (!cands.length) {
    ouvrirAction(`<div class="modal-form">${actionHead('Fusionner avec un autre post')}<div class="am-body">
      <p>Aucun autre post ne peut être fusionné avec « ${escBr(p.titre)} » : la fusion réunit deux posts qui n’ont aucun réseau en commun (par exemple un post Instagram et un post Facebook).</p></div>
      <div class="modal-foot"><button type="button" class="btn" data-action="close-dialog">Fermer</button></div></div>`);
    return;
  }
  const dlg = ouvrirAction(`<form class="modal-form" novalidate>${actionHead('Fusionner avec un autre post')}<div class="am-body">
    <p><strong>${escBr(p.titre)}</strong><br>${esc(dateAvecJour(p.datePublication))}, sur ${esc(reseauxTxt(p))}.</p>
    <p class="hint">Choisis le post à réunir avec celui-ci : un post qui n’a aucun réseau en commun avec lui, par exemple la version Facebook d’un post Instagram. Les deux n’en feront plus qu’un.</p>
    <label class="f"><span>Chercher un post</span><input type="text" id="fusFiltre" placeholder="Un mot du titre…" autocomplete="off"></label>
    <div class="cand-list blk" id="fusListe" role="radiogroup" aria-label="Posts pouvant être fusionnés"></div></div>
    <div class="modal-foot"><button type="button" class="btn" data-action="close-dialog">Annuler</button><button type="submit" class="btn primary" disabled>Continuer</button></div></form>`);
  const form = dlg.querySelector('form');
  const liste = dlg.querySelector('#fusListe');
  const filtre = dlg.querySelector('#fusFiltre');
  const suite = form.querySelector('[type=submit]');
  let choisiId = choisi;
  const dessiner = () => {
    const motif = filtre.value.trim().toLowerCase();
    const filtres = cands.filter((q) => !motif || q.titre.toLowerCase().includes(motif));
    const vus = filtres.slice(0, motif ? 60 : 12);
    if (choisiId && !vus.some((q) => q.id === choisiId)) choisiId = '';
    liste.innerHTML = vus.length
      ? vus.map((q) => candidatHtml(q, q.id === choisiId)).join('') + (filtres.length > vus.length ? '<p class="hint">Les plus proches sont affichés : cherche par titre pour trouver les autres.</p>' : '')
      : '<p class="hint">Aucun post ne correspond.</p>';
    suite.disabled = !choisiId;
  };
  liste.addEventListener('change', (e) => { if (e.target.name === 'autre') { choisiId = e.target.value; suite.disabled = false; } });
  filtre.addEventListener('input', dessiner);
  form.addEventListener('submit', (e) => { e.preventDefault(); if (choisiId) openFusionChoix(id, choisiId); });
  dessiner();
}

// Étape 2 : voir les deux versions et choisir ce qu’on garde quand elles diffèrent.
function openFusionChoix(idA, idB) {
  const a = postById(idA);
  const b = postById(idB);
  if (!a || !b) return;
  const nomA = `Post ${reseauxTxt(a)}`;
  const nomB = `Post ${reseauxTxt(b)}`;
  const union = RESEAUX.filter((n) => a.plateformes.includes(n) || b.plateformes.includes(n));
  const nomEv = (p) => { const ev = p.eventId && evById(p.eventId); return ev ? ev.nom : ''; };
  const CHAMPS = [
    ['titre', 'Titre', (p) => p.titre],
    ['datePublication', 'Date de publication', (p) => dateAvecJour(p.datePublication)],
    ['heure', 'Heure', (p) => heureFr(p.heure)],
    ['description', 'Légende', (p) => p.description],
    ['hashtags', 'Hashtags', (p) => p.hashtags],
    ['imageIdee', 'Idée d’image', (p) => p.imageIdee],
    ['eventId', 'Événement lié', nomEv],
    ['atelier', 'Atelier ou thème', (p) => p.atelier],
    ['angle', 'Angle du post', (p) => p.angle],
    ['vigilance', 'Point de vigilance', (p) => p.vigilance],
  ];
  const conflits = [];
  const repris = [];
  for (const [cle, label, fmt] of CHAMPS) {
    const va = a[cle] || '';
    const vb = b[cle] || '';
    if (va && vb && va !== vb) conflits.push([cle, label, fmt]);
    else if (va || vb) repris.push({ label, texte: fmt(va ? a : b), source: va && vb ? '' : (va ? nomA : nomB) });
  }
  const choixHtml = ([cle, label, fmt]) => `<fieldset class="mg-field"><legend>${esc(label)}</legend><div class="mg-pair">${[a, b].map((p, i) =>
    `<label class="mg-opt"><input type="radio" name="c-${cle}" value="${esc(p.id)}"${i === 0 ? ' checked' : ''}><span class="mg-box"><span class="mg-who">${esc(i === 0 ? nomA : nomB)}</span>${esc(fmt(p))}</span></label>`).join('')}</div></fieldset>`;

  // Statut : si les deux diffèrent, on propose de repartir « à valider » (l’utilisateur décide), ou de garder l’un des deux.
  const statutDiff = a.statut !== b.statut;
  let statutHtml = '';
  if (statutDiff) {
    const opts = [{ val: a.id, label: STATUTS[a.statut], who: nomA }, { val: b.id, label: STATUTS[b.statut], who: nomB }];
    if (a.statut !== 'idee' && b.statut !== 'idee') opts.push({ val: 'idee', label: STATUTS.idee, who: 'Remettre à valider (conseillé)' });
    const defaut = a.statut === 'idee' ? a.id : b.statut === 'idee' ? b.id : 'idee';
    statutHtml = `<fieldset class="mg-field"><legend>Statut</legend><div class="mg-trio">${opts.map((o) =>
      `<label class="mg-opt"><input type="radio" name="c-statut" value="${esc(o.val)}"${o.val === defaut ? ' checked' : ''}><span class="mg-box"><span class="mg-who">${esc(o.who)}</span>${esc(o.label)}</span></label>`).join('')}</div></fieldset>`;
  } else {
    repris.push({ label: 'Statut', texte: STATUTS[a.statut], source: '' });
  }

  // Images Instagram + Facebook : un seul visuel (une photo ou un carrousel) pour les deux réseaux.
  const phA = listePhotos(a, 'meta');
  const phB = listePhotos(b, 'meta');
  const conflitPhoto = phA.length > 0 && phB.length > 0;
  const libImages = (n) => (n > 1 ? `carrousel de ${n} images` : '1 photo');
  let photoHtml = '';
  if (conflitPhoto) {
    const imgOpt = (p, liste, who, i) => `<label class="mg-opt"><input type="radio" name="c-photo" value="${esc(p.id)}"${i === 0 ? ' checked' : ''}><span class="mg-box"><span class="mg-who">${esc(who)} : ${libImages(liste.length)}</span><span class="mg-imgs${liste.length === 1 ? ' un' : ''}">${liste.slice(0, 6).map((f, k) => `<img class="mg-img" data-photo="${esc(p.id)}" data-slot="meta" data-fichier="${esc(f.fichier)}" alt="Image ${k + 1} du ${esc(who.toLowerCase())}">`).join('')}</span>${liste.length > 6 ? `<small>et ${liste.length - 6} autres images</small>` : ''}</span></label>`;
    photoHtml = `<fieldset class="mg-field"><legend>Images Instagram + Facebook</legend><div class="mg-trio">${imgOpt(a, phA, nomA, 0)}${imgOpt(b, phB, nomB, 1)}<label class="mg-opt"><input type="radio" name="c-photo" value="aucune"><span class="mg-box"><span class="mg-who">Sans image</span>Ne garder aucune image</span></label></div></fieldset>`;
  } else if (phA.length || phB.length) {
    const liste = phA.length ? phA : phB;
    repris.push({ label: 'Images Instagram + Facebook', texte: libImages(liste.length) + ' jointe' + (liste.length > 1 ? 's' : ''), source: phA.length ? nomA : nomB });
  }

  const nbChoix = conflits.length + (statutDiff ? 1 : 0) + (conflitPhoto ? 1 : 0);
  const reprisHtml = repris.length
    ? `<div class="blk mg-auto"><h3>Repris automatiquement</h3><dl>${repris.map((r) => `<div><dt>${esc(r.label)}</dt><dd>${esc(titreCourt(r.texte, 140))}${r.source ? ` <small>(${esc(r.source)})</small>` : ''}</dd></div>`).join('')}</dl></div>`
    : '';
  const dlg = ouvrirAction(`<form class="modal-form" novalidate>${actionHead('Fusionner deux posts')}<div class="am-body">
    <p>« ${esc(titreCourt(a.titre))} » et « ${esc(titreCourt(b.titre))} » n’en feront plus qu’un, prévu sur <strong>${esc(listeFr(union))}</strong>. « ${esc(titreCourt(a.titre))} » est conservé ; <strong>« ${esc(titreCourt(b.titre))} » est supprimé</strong>.</p>
    ${nbChoix ? '<p class="hint">Quand les deux posts diffèrent, choisis ce que tu gardes.</p>' : '<p class="hint">Les deux posts ne diffèrent sur aucun point : rien à choisir.</p>'}
    ${conflits.map(choixHtml).join('')}${statutHtml}${photoHtml}${reprisHtml}
    <p class="form-error" role="alert" hidden></p></div>
    <div class="modal-foot"><button type="button" class="btn" data-action="merge-back" data-id="${esc(idA)}" data-autre="${esc(idB)}">Retour</button><span class="spacer"></span><button type="button" class="btn" data-action="close-dialog">Annuler</button><button type="submit" class="btn primary">${icon('i-merge')}Fusionner les deux posts</button></div></form>`, { large: true });
  hydratePhotos(dlg);
  const form = dlg.querySelector('form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const choix = {};
    for (const [cle] of conflits) choix[cle] = fd.get(`c-${cle}`);
    if (statutDiff && fd.get('c-statut') !== 'idee') choix.statut = fd.get('c-statut');
    if (conflitPhoto) choix.photo = fd.get('c-photo');
    soumettreAction(form, async () => {
      const res = await api('POST', '/api/posts/fusionner', { ids: [idA, idB], garder: idA, choix });
      await actionTerminee();
      montrerDate(res.post.datePublication);
      toast(`Posts fusionnés : « ${titreCourt(res.post.titre)} » est prévu sur ${listeFr(res.post.plateformes)}.`, { undo: annulerDernier });
    });
  });
}

/* ---- glisser-déposer : un post sur un autre jour le déplace ; avec Ctrl (Option sur Mac), il est cloné ---- */
let glisse = '';
let jourCible = null;
const copieDemandee = (e) => e.ctrlKey || e.altKey || e.metaKey;

function viderSurvol() {
  if (jourCible) jourCible.classList.remove('drop-ok', 'copie');
  jourCible = null;
}
function finGlisse() {
  viderSurvol();
  document.querySelectorAll('.chip-wrap.dragging').forEach((el) => el.classList.remove('dragging'));
  glisse = '';
}

document.addEventListener('dragstart', (e) => {
  const w = e.target instanceof Element ? e.target.closest('.chip-wrap') : null;
  if (!w) return;
  glisse = w.dataset.id;
  e.dataTransfer.effectAllowed = 'copyMove';
  e.dataTransfer.setData('text/plain', glisse);
  w.classList.add('dragging');
});
document.addEventListener('dragover', (e) => {
  if (!glisse) return;
  const jour = e.target instanceof Element ? e.target.closest('.day[data-date]') : null;
  if (!jour) { viderSurvol(); return; }
  e.preventDefault();
  const copie = copieDemandee(e);
  e.dataTransfer.dropEffect = copie ? 'copy' : 'move';
  if (jour !== jourCible) { viderSurvol(); jourCible = jour; jour.classList.add('drop-ok'); }
  jour.classList.toggle('copie', copie);
});
document.addEventListener('drop', (e) => {
  if (!glisse) return;
  const jour = e.target instanceof Element ? e.target.closest('.day[data-date]') : null;
  const id = glisse;
  const copie = copieDemandee(e);
  finGlisse();
  if (!jour) return;
  e.preventDefault();
  const date = jour.dataset.date;
  guard(() => (copie ? clonerVers(id, [date]) : deplacerPost(id, date)));
});
document.addEventListener('dragend', finGlisse);

const CHAMPS_FICHE = { post: ['titre', 'datePublication', 'heure', 'plateformes', 'eventId', 'description', 'hashtags', 'imageIdee', 'atelier', 'angle', 'vigilance', 'statut'], event: ['nom', 'dateDebut', 'dateFin', 'explication', 'lienElisa30'] };
const ficheOuverte = () => { const dlg = $('#drawer'); return dlg.open ? dlg.querySelector('form[data-form=post],form[data-form=event]') : null; };
const elementDe = (kind, id) => (kind === 'post' ? postById(id) : evById(id));

function ecrireChamp(form, nom, valeur) {
  if (nom === 'plateformes') {
    form.querySelectorAll('input[name=plateformes]').forEach((i) => { i.checked = (valeur || []).includes(i.value); });
    photoSlotsSync(form);
    updateCount(form);
    return;
  }
  const el = form.elements[nom];
  if (!el) return;
  el.value = valeur ?? '';
  const cible = el instanceof RadioNodeList ? el[0] : el;
  // Ces événements repeignent le surlignage et les compteurs ; le champ `_dirty` est rétabli par l'appelant.
  cible.dispatchEvent(new Event('input', { bubbles: true }));
  cible.dispatchEvent(new Event('change', { bubbles: true }));
}

/**
 * Recharge le calendrier, puis reporte dans la fiche ouverte ce qui a changé sur le serveur (agent, annulation).
 * Seuls les champs modifiés sont réécrits : une saisie en cours sur un autre champ n'est pas perdue.
 */
async function resynchroniser() {
  const form = ficheOuverte();
  const id = form && form.dataset.id;
  const kind = form && form.dataset.form;
  const avant = id ? elementDe(kind, id) : null;
  await refresh();
  if (!id || !form.isConnected) return;
  const dlg = $('#drawer');
  const apres = elementDe(kind, id);
  if (!apres) {
    dlg._dirty = false;
    dlg.close();
    toast(kind === 'post' ? 'Ce post n’existe plus.' : 'Cet événement n’existe plus.', { undo: annulerDernier });
    return;
  }
  if (!avant) return;
  const brouillon = dlg._dirty;
  for (const champ of CHAMPS_FICHE[kind]) {
    if (JSON.stringify(avant[champ]) === JSON.stringify(apres[champ])) continue;
    ecrireChamp(form, champ, champ === 'dateFin' && apres.dateFin === apres.dateDebut ? '' : apres[champ]);
  }
  if (kind === 'post' && JSON.stringify(avant.photos) !== JSON.stringify(apres.photos)) {
    for (const s of Object.keys(SLOTS)) {
      const fichiers = listePhotos(apres, s).map((f) => f.fichier);
      const st = dlg._photos[s];
      st.items = [...fichiers.map((fichier) => ({ fichier })), ...st.items.filter((it) => it.blob)];
      st.base = fichiers;
      photoSlotRefresh(form, s);
    }
  }
  dlg._dirty = brouillon;
}

let historiqueOccupe = false;
async function parcourirHistorique(sens) {
  if (historiqueOccupe) return;
  historiqueOccupe = true;
  try {
    const r = await api('POST', `/api/historique/${sens}`, {});
    state.historique = r.historique;
    majHistorique();
    await resynchroniser();
    toast(`${sens === 'annuler' ? 'Annulé' : 'Rétabli'} : ${r.libelle}.`);
  } finally {
    historiqueOccupe = false;
  }
}
function annulerDernier() { guard(() => parcourirHistorique('annuler')); }

document.addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const k = e.key.toLowerCase();
  const annuler = k === 'z' && !e.shiftKey;
  const retablir = k === 'y' || (k === 'z' && e.shiftKey);

  if (e.target instanceof Element && e.target.closest('textarea,input:not([type=checkbox]):not([type=radio]),select,[contenteditable]')) return;

/** Met en forme le Markdown courant des réponses. Le texte est échappé d'abord : aucune balise venue du modèle ne peut passer. */
function markdownIa(texte) {
  const enLigne = (s) => escBr(s.replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, '$1 ($2)'))
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>');
  const blocs = [];
  let para = [];
  let liste = null;
  const finPara = () => { if (para.length) blocs.push(`<p>${para.join('<br>')}</p>`); para = []; };
  const finListe = () => { if (liste) blocs.push(`<${liste.tag}>${liste.items.map((i) => `<li>${i}</li>`).join('')}</${liste.tag}>`); liste = null; };
  for (const brut of String(texte).split(/\r?\n/)) {
    const ligne = brut.trim();
    if (!ligne) { finPara(); continue; } // une ligne vide entre deux puces ne coupe pas la liste
    if (/^([-*_])\1{2,}$/.test(ligne)) { finPara(); finListe(); continue; }
    const titre = ligne.match(/^#{1,6}\s+(.*)$/);
    if (titre) { finPara(); finListe(); blocs.push(`<p class="ia-titre">${enLigne(titre[1])}</p>`); continue; }
    const puce = ligne.match(/^(?:[-*•]\s+|(\d+)[.)]\s+)(.*)$/);
    if (puce) {
      finPara();
      const tag = puce[1] ? 'ol' : 'ul';
      if (liste && liste.tag !== tag) finListe();
      if (!liste) liste = { tag, items: [] };
      liste.items.push(enLigne(puce[2]));
      continue;
    }
    finListe();
    para.push(enLigne(ligne));
  }
  finPara();
  finListe();
  return blocs.join('');
}

function dessinerChat() {
  const log = $('#iaLog');
  const dernierAvecActions = chat.messages.map((m) => Boolean(m.annulable)).lastIndexOf(true);
  let html = chat.messages.map((m, i) => {
    if (m.role === 'erreur') return `<div class="ia-msg erreur">${esc(m.texte)}</div>`;
    if (m.role === 'user') return `<div class="ia-msg user">${esc(m.texte)}</div>`;
    const actions = m.actions && m.actions.length ? `<ul class="ia-actions">${m.actions.map((a) => `<li>${icon('i-check')}<span>${esc(a)}</span></li>`).join('')}</ul>` : '';
    const annuler = i === dernierAvecActions && state.historique.annuler ? '<button type="button" class="ia-lien" data-action="hist-annuler">Annuler ces modifications</button>' : '';
    const confirmations = (m.confirmations || []).map((c) => (c.resultat
      ? `<div class="ia-confirm clos"><p>${esc(c.detail)}</p><p><strong>${esc(c.resultat)}</strong></p></div>`
      : `<div class="ia-confirm"><p><strong>${esc(c.libelle)}</strong></p><p>${esc(c.detail)}</p><div class="boutons"><button type="button" class="btn small no" data-action="ia-confirmer" data-m="${i}" data-id="${esc(c.id)}" data-accepter="1">Confirmer</button><button type="button" class="btn small" data-action="ia-confirmer" data-m="${i}" data-id="${esc(c.id)}">Ne pas le faire</button></div></div>`)).join('');
    return `<div class="ia-ligne">${MASCOTTE}<div class="ia-msg assistant"><div class="ia-texte">${markdownIa(m.texte)}</div>${actions}${annuler}</div></div>${confirmations}`;
  }).join('');
  if (!agentPret()) {
    html = `<div class="ia-vide"><p>L’agent n’est pas encore configuré. Ajoute une clé API et choisis un modèle.</p><button type="button" class="btn primary" data-action="ia-reglages">Ouvrir les réglages</button></div>`;
  } else if (!html) {
    html = '<div class="ia-vide"><span class="ia-mascotte grande" aria-hidden="true"></span><p>Demande-moi d’ajouter un post, de déplacer un événement, de valider des idées ou de corriger un texte.</p></div>';
  }
  if (chat.encours) html += `<div class="ia-ligne">${MASCOTTE}<div class="ia-attente">L’agent réfléchit…</div></div>`;
  log.innerHTML = html;
  log.scrollTop = log.scrollHeight;
}

function contexteAgent() {
  const c = { vue: state.view, mois: state.month };
  const form = ficheOuverte();
  if (form) {
    const fd = new FormData(form);
    const valeurs = {};
    for (const k of new Set(fd.keys())) valeurs[k] = k === 'plateformes' ? fd.getAll(k) : fd.get(k);
    c.ouvert = { type: form.dataset.form === 'post' ? 'post' : 'evenement', id: form.dataset.id || null, valeurs };
  }
  return c;
}

/** Ce que le modèle relit au tour suivant : le texte, plus le rappel des actions qui ne sont pas dans les mots de la réponse. */
const messagesPourApi = () => chat.messages.filter((m) => m.role !== 'erreur').map((m) => ({
  role: m.role,
  content: `${m.texte}${m.memoire ? `\n\n[Actions effectuées : ${m.memoire}]` : ''}`,
}));

async function envoyerAgent(texte) {
  const propre = String(texte || '').trim();
  if (!propre || chat.encours) return false;
  chat.messages.push({ role: 'user', texte: propre });
  chat.encours = true;
  dessinerChat();
  try {
    const r = await api('POST', '/api/agent/message', { messages: messagesPourApi(), contexte: contexteAgent() });
    chat.messages.push({ role: 'assistant', texte: r.reponse, actions: r.actions, confirmations: r.confirmations, memoire: r.actions.join(' ; '), annulable: r.actions.length > 0 });
    if (r.formulaire) {
      const form = ficheOuverte();
      if (form) {
        for (const [champ, valeur] of Object.entries(r.formulaire)) ecrireChamp(form, champ, valeur);
        $('#drawer')._dirty = true;
      }
    }
    if (r.actions.length) await resynchroniser();
  } catch (err) {
    chat.messages.push({ role: 'erreur', texte: err.message || 'Une erreur est survenue.' });
  } finally {
    chat.encours = false;
    dessinerChat();
  }
  return true;
}

async function repondreConfirmation(iMessage, id, accepter) {
  const m = chat.messages[iMessage];
  const c = m && (m.confirmations || []).find((x) => x.id === id);
  if (!c || c.resultat) return;
  try {
    const r = await api('POST', '/api/agent/confirmer', { id, accepter });
    c.resultat = r.message;
    m.memoire = [m.memoire, `${c.detail} : ${r.message}`].filter(Boolean).join(' ; ');
    if (r.fait) {
      m.annulable = true;
      await resynchroniser();
    }
  } catch (err) {
    c.resultat = err.message || 'Action impossible.';
  }
  dessinerChat();
}

function afficherReglages(main) {
  const vue = state.reglagesOnglet;
  if (main.querySelector(`[data-reglages=${vue}]`)) return; // ne pas effacer une saisie en cours à chaque mise à jour du calendrier
  const onglets = [['general', 'Général'], ['agent', 'Agent IA']].map(([v, l]) => `<button type="button" class="tab" data-action="reglages-onglet" data-onglet="${v}"${vue === v ? ' aria-current="page"' : ''}>${l}</button>`).join('');
  const entete = `<div class="cal-bar"><h2 style="font-size:27px">Réglages</h2></div>
    <div class="sous-onglets" role="group" aria-label="Sections des réglages">${onglets}</div>`;
  if (vue === 'general') {
    main.innerHTML = `${entete}<form class="reglages" id="reglagesGeneral" data-reglages="general" novalidate>
      <label class="f"><span>Nom de la structure <em>facultatif</em></span><input type="text" name="structure" maxlength="80" value="${esc(state.structure)}"></label>
      <p class="hint">Affiché à côté du logo, repris dans l’export Excel et donné à l’agent IA. Laisse vide pour ne rien afficher.</p>
      <div class="boutons"><button type="submit" class="btn primary">Enregistrer</button><span class="etat" id="reglEtat" role="status"></span></div>
    </form>`;
    const form = main.querySelector('form');
    form.addEventListener('submit', (e) => { e.preventDefault(); enregistrerGeneral(form); });
    return;
  }
  const a = state.agent;
  if (!a) { main.innerHTML = '<p class="loading">Chargement des réglages…</p>'; return; }
  const perm = (n, label, detail) => `<label class="radio"><input type="checkbox" name="perm-${n}"${a.permissions[n] ? ' checked' : ''}><span>${label} <span class="hint">${detail}</span></span></label>`;
  const effort = (v, l) => `<option value="${v}"${a.effort === v ? ' selected' : ''}>${l}</option>`;
  const four = (v, l) => `<label class="opt"><input type="radio" name="fournisseur" value="${v}"${a.fournisseur === v ? ' checked' : ''}><span>${l}</span></label>`;
  main.innerHTML = `${entete}
    <form class="reglages" id="reglagesAgent" data-reglages="agent" novalidate>
      <label class="radio"><input type="checkbox" name="actif"${a.actif ? ' checked' : ''}><strong>Activer l’agent IA</strong></label>
      <label class="f"><span>Nom de l’agent</span><input type="text" name="nom" maxlength="60" value="${esc(a.nom)}"></label>
      <fieldset><legend>Fournisseur</legend><div class="pills">${four('anthropic', 'Claude (Anthropic)')}${four('openrouter', 'OpenRouter')}</div></fieldset>
      <div class="f"><label class="f"><span>Clé API</span><input type="password" name="cle" autocomplete="off" spellcheck="false"></label><p class="hint" id="reglCle"></p>
        <div><button type="button" class="btn small" data-action="ia-retirer-cle" hidden>Retirer la clé enregistrée</button></div></div>
      <label class="f"><span>Modèle</span><input type="text" name="modele" list="reglModeles" maxlength="120" spellcheck="false"><datalist id="reglModeles"></datalist><span class="hint" id="reglModeleAide"></span></label>
      <label class="f" id="reglEffort"><span>Niveau de réflexion</span><select name="effort">${effort('low', 'Rapide et économique')}${effort('medium', 'Équilibré (recommandé)')}${effort('high', 'Approfondi')}</select></label>
      <label class="f"><span>Instructions pour l’agent <em>facultatif</em></span><textarea name="instructions" rows="5" maxlength="4000" placeholder="Ton à employer, tutoiement ou vouvoiement, règles de rédaction de ta structure…">${esc(a.instructions)}</textarea></label>
      <fieldset><legend>L’agent peut aussi</legend>
        <p class="hint">Créer, déplacer, modifier et changer le statut restent toujours permis, avec Annuler disponible.</p>
        ${perm('supprimer', 'Supprimer des posts et des événements', '(après confirmation)')}
        ${perm('cloner', 'Cloner des posts', '')}
        ${perm('fusionner', 'Fusionner des posts', '(après confirmation)')}
        ${perm('images', 'Voir les images des posts', '(transmises au fournisseur d’IA, coût plus élevé)')}
      </fieldset>
      <div class="boutons"><button type="submit" class="btn primary">Enregistrer</button><button type="button" class="btn" data-action="ia-tester">Tester la connexion</button><span class="etat" id="reglEtat" role="status"></span></div>
    </form>`;
  const form = main.querySelector('#reglagesAgent');
  form._modeles = { ...a.modeles };
  form._courant = a.fournisseur;
  form.addEventListener('change', (e) => { if (e.target.name === 'fournisseur') changerFournisseur(form); });
  form.addEventListener('submit', (e) => { e.preventDefault(); enregistrerReglages(form).catch(() => {}); });
  remplirFournisseur(form);
}

async function enregistrerGeneral(form) {
  try {
    const r = await api('PUT', '/api/reglages', { structure: form.elements.structure.value });
    majStructure(r.structure);
    form.elements.structure.value = r.structure;
    etatReglages(form, 'Réglages enregistrés.', true);
  } catch (err) {
    etatReglages(form, err.message, false);
  }
}

function changerFournisseur(form) {
  form._modeles[form._courant] = form.elements.modele.value.trim();
  form._courant = form.elements.fournisseur.value;
  form.elements.cle.value = '';
  remplirFournisseur(form);
}

async function remplirFournisseur(form) {
  const f = form._courant;
  const info = state.agent.cles[f];
  const cle = form.elements.cle;
  const aide = form.querySelector('#reglCle');
  cle.disabled = info.source === 'env';
  cle.placeholder = info.source === 'env' ? '' : info.definie ? '•••••••• (laisser vide pour conserver)' : f === 'anthropic' ? 'sk-ant-…' : 'sk-or-…';
  aide.textContent = info.source === 'env'
    ? `La clé vient de la variable ${info.variable} du serveur : elle n’est pas modifiable ici.`
    : info.definie ? 'Une clé est enregistrée sur le serveur. Elle n’est jamais renvoyée au navigateur.' : `Stockée sur le serveur uniquement. Tu peux aussi définir la variable ${info.variable}.`;
  form.querySelector('[data-action=ia-retirer-cle]').hidden = info.source !== 'reglages';
  form.elements.modele.value = form._modeles[f] || '';
  form.querySelector('#reglEffort').hidden = f !== 'anthropic';
  const liste = form.querySelector('#reglModeles');
  const aideModele = form.querySelector('#reglModeleAide');
  liste.innerHTML = '';
  aideModele.textContent = f === 'anthropic' ? 'Choisis dans la liste, ou saisis l’identifiant d’un modèle.' : 'Chargement de la liste OpenRouter…';
  try {
    if (!iaChargerModeles.has(f)) iaChargerModeles.set(f, api('GET', `/api/agent/modeles?fournisseur=${f}`));
    const modeles = await iaChargerModeles.get(f);
    if (form._courant !== f) return;
    liste.innerHTML = modeles.map((m) => `<option value="${esc(m.id)}">${esc(m.nom)}</option>`).join('');
    if (f === 'openrouter') aideModele.textContent = `${modeles.length} modèles compatibles avec les outils. Commence à saisir un nom pour filtrer.`;
  } catch {
    iaChargerModeles.delete(f);
    if (form._courant === f) aideModele.textContent = 'Liste indisponible : saisis l’identifiant du modèle (par exemple anthropic/claude-…).';
  }
}

function etatReglages(form, message, ok) {
  const el = form.querySelector('#reglEtat');
  el.textContent = message;
  el.className = `etat ${message ? (ok ? 'ok' : 'ko') : ''}`;
}

async function enregistrerReglages(form) {
  const f = form._courant;
  const el = form.elements;
  const corps = {
    actif: el.actif.checked,
    nom: el.nom.value,
    fournisseur: f,
    modeles: { [f]: el.modele.value.trim() },
    effort: el.effort.value,
    instructions: el.instructions.value,
    permissions: Object.fromEntries(['supprimer', 'cloner', 'fusionner', 'images'].map((p) => [p, el[`perm-${p}`].checked])),
  };
  if (el.cle.value.trim()) corps.cles = { [f]: el.cle.value.trim() };
  try {
    state.agent = await api('PUT', '/api/agent/reglages', corps);
  } catch (err) {
    etatReglages(form, err.message, false);
    throw err;
  }
  form._modeles = { ...state.agent.modeles };
  el.cle.value = '';
  remplirFournisseur(form);
  majDockAgent();
  majContexteIa();
  if (chat.ouvert) dessinerChat();
  etatReglages(form, 'Réglages enregistrés.', true);
}

async function testerReglages(form, bouton) {
  bouton.disabled = true;
  etatReglages(form, 'Test en cours…', true);
  try {
    await enregistrerReglages(form);
    etatReglages(form, 'Test en cours…', true);
    const r = await api('POST', '/api/agent/tester', {});
    etatReglages(form, r.message, true);
  } catch (err) {
    etatReglages(form, err.message, false);
  } finally {
    bouton.disabled = false;
  }
}

async function retirerCle(form) {
  state.agent = await api('PUT', '/api/agent/reglages', { cles: { [form._courant]: null } });
  remplirFournisseur(form);
  majContexteIa();
  etatReglages(form, 'Clé retirée.', true);
}

async function chargerAgent() {
  state.agent = await api('GET', '/api/agent/reglages');
  majDockAgent();
  if (state.view === 'reglages') render();
}

/* ================= événements du DOM ================= */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) {
    // clic sur le fond du tiroir ou d’une fenêtre : fermeture
    if (e.target instanceof HTMLDialogElement && e.target.id !== 'tokenDlg') closeDialog(e.target);
    return;
  }
  const d = t.dataset;
  switch (d.action) {
    case 'view': state.view = d.view; render(); window.scrollTo(0, 0); break;
    case 'nav-prev': state.month = shiftMonth(state.month, -1); render(); break;
    case 'nav-next': state.month = shiftMonth(state.month, 1); render(); break;
    case 'nav-today': state.month = todayIso().slice(0, 7); render(); break;
    case 'choisir-vue': if (d.cible === 'ev') state.evVue = d.vue; else state.valVue = d.vue; render(); break;
    case 'ev-prev': state.evMois = shiftMonth(state.evMois, -1); render(); break;
    case 'ev-next': state.evMois = shiftMonth(state.evMois, 1); render(); break;
    case 'ev-today': state.evMois = todayIso().slice(0, 7); render(); break;
    case 'choisir-mois': state.valMois = d.mois; render(); window.scrollTo(0, 0); break;
    case 'toggle-mois': state.collapsed.has(d.key) ? state.collapsed.delete(d.key) : state.collapsed.add(d.key); render(); break;
    case 'toggle-statut': state.hidden.has(d.statut) ? state.hidden.delete(d.statut) : state.hidden.add(d.statut); render(); break;
    case 'new-post': {
      const dlg = $('#drawer');
      if (dlg.open) { dlg._dirty = false; dlg.close(); }
      openPost(null, { date: d.date, eventId: d.event });
      break;
    }
    case 'edit-post': {
      const dlg = $('#drawer');
      if (dlg.open) { dlg._dirty = false; dlg.close(); }
      openPost(d.id);
      break;
    }
    case 'new-event': openEvent(null, { date: d.date }); break;
    case 'edit-event': {
      const dlg = $('#drawer');
      if (dlg.open) { dlg._dirty = false; dlg.close(); }
      openEvent(d.id);
      break;
    }
    case 'set-statut': guard(() => setStatut(d.id, d.statut)); break;
    case 'photo-pick': t.closest('.ph-slot').querySelector('input[type=file]').click(); break;
    case 'photo-remove': photoRemoved(t.closest('form'), d.slot, Number(d.i)); break;
    case 'photo-move': photoMoved(t.closest('form'), d.slot, Number(d.i), Number(d.dir)); break;
    case 'photo-prev': lightboxStep(-1); break;
    case 'photo-next': lightboxStep(1); break;
    case 'photo-download': guard(() => downloadPhoto(d.id, d.slot)); break;
    case 'photo-zoom': ouvrirPhoto(t.querySelector('img')); break;
    case 'open-export': openExport(); break;
    case 'move-post': openDeplacer(d.id); break;
    case 'clone-post': openCloner(d.id); break;
    case 'merge-post': openFusion(d.id); break;
    case 'merge-back': openFusion(d.id, d.autre); break;
    case 'clone-add-date': {
      const rows = $('#cloneDates');
      rows.insertAdjacentHTML('beforeend', ligneDate());
      rows.lastElementChild.querySelector('input').focus();
      break;
    }
    case 'clone-del-date': {
      const rows = t.closest('.date-rows');
      if (rows.children.length > 1) t.closest('.date-row').remove(); else rows.querySelector('input').value = '';
      break;
    }
    case 'close-dialog': closeDialog(t.closest('dialog')); break;
    case 'delete-arm':
      if (t.classList.contains('armed')) { guard(() => deleteCurrent(t.closest('form'))); break; }
      t.classList.add('armed');
      t.textContent = 'Confirmer la suppression';
      setTimeout(() => { if (t.isConnected) { t.classList.remove('armed'); t.textContent = 'Supprimer'; } }, 5000);
      break;
    case 'undo': { const el = $('#toast'); const fn = el._undo; el.hidden = true; el._undo = null; if (fn) fn(); break; }
    case 'hist-annuler': annulerDernier(); break;
    case 'hist-retablir': guard(() => parcourirHistorique('retablir')); break;
    case 'ia-basculer': basculerChat(); break;
    case 'ia-nouveau': chat.messages = []; dessinerChat(); $('#iaSaisie textarea').focus(); break;
    case 'ia-suggestion': envoyerAgent(d.texte); break;
    case 'ia-confirmer': repondreConfirmation(Number(d.m), d.id, d.accepter === '1'); break;
    case 'ia-reglages': {
      const dlg = $('#drawer');
      if (dlg.open) closeDialog(dlg);
      if (dlg.open) break; // l'utilisateur a choisi de garder ses modifications
      state.view = 'reglages';
      state.reglagesOnglet = 'agent';
      render();
      break;
    }
    case 'reglages-onglet': state.reglagesOnglet = d.onglet; render(); break;
    case 'ia-tester': testerReglages(t.closest('form'), t); break;
    case 'ia-retirer-cle': guard(() => retirerCle(t.closest('form'))); break;
    default: break;
  }
});

function closeDialog(dlg) {
  if (dlg && dlg._dirty && !window.confirm('Abandonner les modifications en cours ?')) return;
  if (dlg) dlg.close();
}

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form=post],form[data-form=event]');
  if (!form) return;
  e.preventDefault();
  const missing = [...form.querySelectorAll('[required]')].find((i) => !i.value.trim());
  if (missing) { formError(form, 'Complète les champs obligatoires.'); missing.focus(); return; }
  if (form.dataset.form === 'post' && !form.querySelector('input[name=plateformes]:checked')) { formError(form, 'Choisis au moins un réseau.'); return; }
  submitForm(form);
});

document.addEventListener('input', (e) => {
  const form = e.target.closest('form[data-form=post]');
  if (form) { updateCount(form); updatePlanifHint(form); }
});
document.addEventListener('change', (e) => {
  if (e.target.name === 'eventId') $('#evInfo').innerHTML = evInfoHtml(e.target.value);
  if (e.target.name === 'plateformes') photoSlotsSync(e.target.closest('form'));
  if (e.target.matches && e.target.matches('input[data-photo-input]')) photoChosen(e.target);
});

// Échap : demander confirmation si le tiroir contient des modifications
$('#drawer').addEventListener('cancel', (e) => {
  const dlg = e.target;
  if (dlg._dirty && !window.confirm('Abandonner les modifications en cours ?')) e.preventDefault();
});
$('#tokenDlg').addEventListener('cancel', (e) => e.preventDefault());
for (const id of ['drawer', 'exportDlg', 'tokenDlg', 'actionDlg', 'photoDlg']) {
  $(`#${id}`).addEventListener('close', (e) => {
    const dlg = e.target;
    // Libère les aperçus des images choisies mais pas enregistrées.
    if (dlg._photos) Object.values(dlg._photos).forEach((st) => st.items.forEach((it) => { if (it.url) URL.revokeObjectURL(it.url); }));
    dlg._photos = null;
    dlg.innerHTML = '';
    dlg._dirty = false;
  });
}

// Image agrandie : flèches gauche/droite du clavier pour parcourir un carrousel.
$('#photoDlg').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') { e.preventDefault(); lightboxStep(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); lightboxStep(1); }
});

/* ================= démarrage ================= */
const poll = () => {
  if (document.visibilityState === 'visible' && !document.querySelector('dialog[open]')) refresh().catch(() => {});
};
setInterval(poll, 20000);
document.addEventListener('visibilitychange', poll);

render();
guard(refresh);
guard(chargerAgent);
})();
</script>
</body>
</html>
