<style>
:root{
  --font:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --bg:#EDF0ED; --surface:#fff; --soft:#F6F8F6;
  --ink:#16242B; --mute:#56676E; --line:#D2DAD6; --line-strong:#AEBBB5;
  --denim:#2A4A7F; --denim-ink:#1B3562; --denim-wash:#D6E1F1; --denim-pale:#EAF0F8;
  --idee:#7F520A; --idee-bg:#FBF0D6; --idee-line:#C58A1A;
  --valide:#1B6444; --valide-bg:#DCF1E4; --valide-line:#2E8D62;
  --refuse:#942A22; --refuse-bg:#F9E1DE; --refuse-line:#C4483E;
  --publie:#42535B; --publie-bg:#E3E8EA; --publie-line:#778990;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
h1,h2,h3,h4,p,dl,dd,fieldset{margin:0;padding:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--denim);outline-offset:2px}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- barre du haut ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line-strong);display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 24px}
.brand{display:flex;align-items:center;gap:11px}
.brand-txt{display:flex;align-items:baseline;gap:10px}
.logo{width:36px;height:36px;flex:none}
.brand h1{font-size:21px;font-weight:700;color:var(--denim);letter-spacing:-.01em}
.brand span{color:var(--mute);font-size:14px}
.tabs{display:flex;gap:4px}
.tab{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:700;color:var(--mute)}
.tab:hover{background:var(--soft);color:var(--ink)}
.tab[aria-current=page]{background:var(--denim-wash);color:var(--denim-ink)}
.badge{min-width:24px;padding:0 6px;border-radius:12px;border:1.5px dashed var(--idee-line);background:var(--idee-bg);color:var(--idee);font-size:13px;line-height:20px;text-align:center}
.top-actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}

/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;border-radius:8px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:700;line-height:1.3}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--denim);border-color:var(--denim);color:#fff}
.btn.primary:hover{background:var(--denim-ink);border-color:var(--denim-ink)}
.btn.ok{background:var(--valide);border-color:var(--valide);color:#fff}
.btn.ok:hover{background:#12513A;border-color:#12513A}
.btn.no{color:var(--refuse);border-color:var(--refuse-line)}

<script>
(() => {
'use strict';

/* ================= utilitaires ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');

const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MOIS_COURTS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const JOURS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
const JOURS_COURTS = ['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'];
const STATUTS = { idee: 'Idée à valider', valide: 'Validé', refuse: 'Refusé', publie: 'Publié' };
const ORDRE = ['idee', 'valide', 'refuse', 'publie'];
const ICONES = { idee: 'i-idea', valide: 'i-check', refuse: 'i-x', publie: 'i-sent' };
const RESEAUX = ['Instagram', 'Facebook', 'LinkedIn'];
const ABREV = { Instagram: 'IG', Facebook: 'FB', LinkedIn: 'LI' };
const LIMITES = { Instagram: 2200, LinkedIn: 3000 };

const toIso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromIso = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayIso = () => toIso(new Date());
const addDays = (iso, n) => { const d = fromIso(iso); d.setDate(d.getDate() + n); return toIso(d); };
const diffDays = (a, b) => Math.round((fromIso(b) - fromIso(a)) / 86400000);
const weekday = (iso) => (fromIso(iso).getDay() + 6) % 7; // 0 = lundi
const dayNum = (iso) => Number(iso.slice(8));
const monthIdx = (iso) => Number(iso.slice(5, 7)) - 1;
const jourMois = (iso) => `${dayNum(iso) === 1 ? '1er' : dayNum(iso)} ${MOIS[monthIdx(iso)]}`;
const dateLongue = (iso) => `${jourMois(iso)} ${iso.slice(0, 4)}`;
const dateAvecJour = (iso) => `${JOURS_COURTS[weekday(iso)]} ${dateLongue(iso)}`;
function periode(a, b) {
  if (!b || a === b) return dateLongue(a);
  const [y1, y2] = [a.slice(0, 4), b.slice(0, 4)];
  const j = (iso) => (dayNum(iso) === 1 ? '1er' : dayNum(iso));
  if (y1 === y2 && monthIdx(a) === monthIdx(b)) return `du ${j(a)} au ${j(b)} ${MOIS[monthIdx(b)]} ${y2}`;
  if (y1 === y2) return `du ${jourMois(a)} au ${jourMois(b)} ${y2}`;
  return `du ${dateLongue(a)} au ${dateLongue(b)}`;
}
const heureFr = (h) => (h ? h.replace(':', 'h') : '');
const listeFr = (a) => (a.length < 2 ? a.join('') : `${a.slice(0, -1).join(', ')} et ${a[a.length - 1]}`);
const titreMois = (ym) => `${MOIS[Number(ym.slice(5)) - 1][0].toUpperCase()}${MOIS[Number(ym.slice(5)) - 1].slice(1)} ${ym.slice(0, 4)}`;
const shiftMonth = (ym, n) => { const d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5)) - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const icon = (id) => `<svg class="ic" aria-hidden="true"><use href="#${id}"/></svg>`;

/* ================= état ================= */
const state = { evenements: [], posts: [], view: 'calendrier', month: todayIso().slice(0, 7), hidden: new Set(), loaded: false, sig: '' };
const evById = (id) => state.evenements.find((e) => e.id === id);
const postById = (id) => state.posts.find((p) => p.id === id);
const parHeure = (a, b) => (a.heure || '').localeCompare(b.heure || '') || a.titre.localeCompare(b.titre);

/* ================= réseau ================= */
let token = '';
try { token = localStorage.getItem('calendy-token') || ''; } catch { /* stockage indisponible */ }

const banner = (show) => { $('#banner').hidden = !show; };

let tokenPromise = null;
function askToken(refused) {
  if (tokenPromise) return tokenPromise;
  tokenPromise = new Promise((resolve) => {
    const dlg = $('#tokenDlg');
    dlg.innerHTML = `<form class="modal-form">
      <header class="modal-head"><h2 id="dlgTitle">Accès protégé</h2></header>
      <p>Saisis le jeton d’accès de Calendy (la valeur de CALENDY_TOKEN sur le serveur).</p>
      ${refused ? '<p class="form-error" role="alert">Ce jeton est refusé. Vérifie-le et réessaie.</p>' : ''}
      <label class="f"><span>Jeton d’accès</span><input type="password" name="token" autocomplete="current-password" required></label>
      <div class="modal-foot"><button class="btn primary" type="submit">Se connecter</button></div></form>`;
    dlg.querySelector('form').addEventListener('submit', (e) => {
      e.preventDefault();
      token = String(new FormData(e.target).get('token')).trim();
      try { localStorage.setItem('calendy-token', token); } catch { /* ignoré */ }
      tokenPromise = null;
      dlg.close();
      resolve();
    });
    dlg.showModal();
  });
  return tokenPromise;
}

async function request(method, path, body) {
  const headers = {};
  if (token) headers.Authorization = `Bearer ${token}`;
  const brut = body instanceof Blob; // photo : on envoie l'image telle quelle
  if (body !== undefined) headers['Content-Type'] = brut ? body.type : 'application/json';
  let res;
  try {
    res = await fetch(path, { method, headers, body: body === undefined ? undefined : brut ? body : JSON.stringify(body) });
  } catch {
    banner(true);
    throw new Error('Serveur injoignable.');
  }
  banner(false);
  if (res.status === 401) {
    await askToken(Boolean(token));
    return request(method, path, body);
  }
  return res;
}

async function api(method, path, body) {
  const res = await request(method, path, body);
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error((data && data.error) || `Erreur ${res.status}`);
  return data;
}

async function refresh() {
  const data = await api('GET', '/api/state');
  const sig = JSON.stringify([data.evenements, data.posts]);
  state.loaded = true;
  if (sig === state.sig && state.rendered) return;
  state.sig = sig;
  state.evenements = data.evenements;
  state.posts = data.posts;
  render();
}

/* ================= message flottant ================= */
let toastTimer = 0;
function toast(message, { undo = null, error = false } = {}) {
  const el = $('#toast');
  clearTimeout(toastTimer);
  el.className = error ? 'error' : '';
  el.innerHTML = `<span>${esc(message)}</span>${undo ? '<button type="button" data-action="undo">Annuler</button>' : ''}`;
  el.hidden = false;
  el._undo = undo;
  toastTimer = setTimeout(() => { el.hidden = true; el._undo = null; }, error ? 9000 : 7000);
}

async function guard(fn) {
  try { await fn(); } catch (err) { toast(err.message || 'Une erreur est survenue.', { error: true }); }
}

/* ================= photos ================= */
// Une photo facultative par visuel : Instagram et Facebook partagent la même, LinkedIn a la sienne.
const SLOTS = { meta: { titre: 'Instagram + Facebook', reseaux: ['Instagram', 'Facebook'] }, linkedin: { titre: 'LinkedIn', reseaux: ['LinkedIn'] } };
const photoCache = new Map();
const hasPhoto = (p) => Boolean(p.photos && (p.photos.meta || p.photos.linkedin));

// Les photos sont protégées par le jeton : on les télécharge avec l'en-tête puis on les affiche via une URL locale.
function photoUrl(p, slot) {
  const f = p.photos && p.photos[slot];
  if (!f) return Promise.resolve('');
  const key = `${p.id}/${slot}/${f.fichier}`;
  if (!photoCache.has(key)) {
    photoCache.set(key, request('GET', `/api/posts/${p.id}/photo/${slot}?v=${encodeURIComponent(f.fichier)}`)
      .then(async (res) => { if (!res.ok) throw new Error('photo'); return URL.createObjectURL(await res.blob()); })
      .catch(() => { photoCache.delete(key); return ''; }));
  }
  return photoCache.get(key);
}

function hydratePhotos(root = document) {
  root.querySelectorAll('img[data-photo]:not([src])').forEach(async (img) => {
    const p = postById(img.dataset.photo);
    const url = p ? await photoUrl(p, img.dataset.slot) : '';
    if (url && img.isConnected) img.src = url;
  });
}

function photosHtml(p) {
  const figs = Object.keys(SLOTS).filter((s) => p.photos && p.photos[s]).map((s) =>
    `<figure class="ph-fig"><img data-photo="${esc(p.id)}" data-slot="${s}" alt="Photo prévue pour ${esc(listeFr(SLOTS[s].reseaux))} : ${esc(p.titre)}"><figcaption>Photo ${esc(SLOTS[s].titre)}</figcaption></figure>`);
  return figs.length ? `<div class="ph-row">${figs.join('')}</div>` : '';
}

/** Réduit la photo à 1600 px maximum et l'enregistre en JPEG : envoi rapide, fichier Excel raisonnable, rotation du téléphone appliquée. */
async function prepareImage(file) {
  if (!file.type.startsWith('image/')) throw new Error('Ce fichier n’est pas une image.');
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch { throw new Error('Ce format d’image n’est pas lu par le navigateur. Utilise une photo JPEG ou PNG.'); }
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * k));
  const h = Math.max(1, Math.round(bmp.height * k));
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.9));
  if (!blob) throw new Error('Impossible de préparer cette image.');
  return blob;
}

function photoSlotHtml(p, slot) {
  const s = SLOTS[slot];
  const has = Boolean(p.photos && p.photos[slot]);
  const visible = p.plateformes.some((n) => s.reseaux.includes(n));
  return `<div class="ph-slot" data-slot="${slot}"${visible ? '' : ' hidden'}>
      <h4>${esc(s.titre)}</h4>
      <div class="ph-box" data-box>${has ? `<img data-photo="${esc(p.id)}" data-slot="${slot}" alt="Photo actuelle pour ${esc(s.titre)}">` : '<span>Aucune photo</span>'}</div>
      <div class="ph-actions">
        <button type="button" class="btn small" data-action="photo-pick" data-slot="${slot}">${icon('i-photo')}<span data-pick-label>${has ? 'Changer' : 'Ajouter'}</span></button>
        <button type="button" class="btn small danger" data-action="photo-remove" data-slot="${slot}"${has ? '' : ' hidden'}>Retirer</button>
      </div>
      <input type="file" accept="image/*" data-photo-input="${slot}" hidden>
      <p class="ph-err form-error" role="alert" hidden></p>
    </div>`;
}

// État des photos du tiroir : { meta|linkedin: { blob, url, remove } }, appliqué à l'enregistrement.
function photoSlotRefresh(form, slot) {
  const el = form.querySelector(`.ph-slot[data-slot=${slot}]`);
  const st = $('#drawer')._photos[slot];
  const existing = postById(form.dataset.id);
  const had = Boolean(existing && existing.photos && existing.photos[slot]) && !st.remove;
  const box = el.querySelector('[data-box]');
  if (st.blob) box.innerHTML = `<img src="${st.url}" alt="Nouvelle photo pour ${esc(SLOTS[slot].titre)}">`;
  else if (had) { box.innerHTML = `<img data-photo="${esc(existing.id)}" data-slot="${slot}" alt="Photo actuelle pour ${esc(SLOTS[slot].titre)}">`; hydratePhotos(box); }
  else box.innerHTML = '<span>Aucune photo</span>';
  el.querySelector('[data-pick-label]').textContent = st.blob || had ? 'Changer' : 'Ajouter';
  el.querySelector('[data-action=photo-remove]').hidden = !(st.blob || had);
}

function photoSlotsSync(form) {
  const nets = [...form.querySelectorAll('input[name=plateformes]:checked')].map((i) => i.value);
  form.querySelectorAll('.ph-slot').forEach((el) => { el.hidden = !SLOTS[el.dataset.slot].reseaux.some((n) => nets.includes(n)); });
}

async function photoChosen(input) {
  const form = input.closest('form');
  const slot = input.dataset.photoInput;
  const err = form.querySelector(`.ph-slot[data-slot=${slot}] .ph-err`);
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  err.hidden = true;
  try {
    const blob = await prepareImage(file);
    const st = $('#drawer')._photos[slot];
    if (st.url) URL.revokeObjectURL(st.url);
    Object.assign(st, { blob, url: URL.createObjectURL(blob), remove: false });
    $('#drawer')._dirty = true;
    photoSlotRefresh(form, slot);
  } catch (e) {
    err.textContent = e.message;
    err.hidden = false;
  }
}

function photoRemoved(form, slot) {
  const st = $('#drawer')._photos[slot];
  if (st.url) URL.revokeObjectURL(st.url);
  Object.assign(st, { blob: null, url: '', remove: true });
  $('#drawer')._dirty = true;
  photoSlotRefresh(form, slot);
}

async function applyPhotos(id, photos, reseaux) {
  for (const slot of Object.keys(SLOTS)) {
    const st = photos[slot];
    if (!SLOTS[slot].reseaux.some((n) => reseaux.includes(n))) continue; // visuel masqué : on ne touche à rien
    if (st.blob) {
      const res = await request('PUT', `/api/posts/${id}/photo/${slot}`, st.blob);
      if (!res.ok) throw new Error(((await res.json().catch(() => null)) || {}).error || `erreur ${res.status}`);
    } else if (st.remove) {
      await api('DELETE', `/api/posts/${id}/photo/${slot}`);
    }
  }
}

/* ================= vues ================= */
function render() {
  state.rendered = true;
  const ideas = state.posts.filter((p) => p.statut === 'idee').length;
  $('#badge').textContent = ideas;
  $('#badge').hidden = ideas === 0;
  document.querySelectorAll('.tab').forEach((t) => {
    if (t.dataset.view === state.view) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
  const main = $('#main');
  if (!state.loaded) { main.innerHTML = '<p class="loading">Chargement du calendrier…</p>'; return; }
  main.innerHTML = state.view === 'calendrier' ? calendarView() : state.view === 'valider' ? validateView() : eventsView();
  hydratePhotos(main);
}

/* ---- pastille d’un post ---- */
function chip(p) {
  const nets = p.plateformes.map((n) => `<span>${ABREV[n]}</span>`).join('');
  const label = `${p.titre}, ${listeFr(p.plateformes)}, ${STATUTS[p.statut]}${hasPhoto(p) ? ', avec photo' : ''}`;
  return `<button type="button" class="chip s-${p.statut}" data-action="edit-post" data-id="${esc(p.id)}" title="${esc(p.titre)}" aria-label="${esc(label)}">
    ${icon(ICONES[p.statut])}<span class="ttl">${esc(p.titre)}</span>
    <span class="sub" aria-hidden="true">${p.heure ? `<span>${heureFr(p.heure)}</span>` : ''}${nets}${hasPhoto(p) ? `<span class="ph-ico" title="Photo jointe">${icon('i-photo')}</span>` : ''}</span></button>`;
}

/* ---- calendrier ---- */
function assignLanes(events, gridStart, gridEnd) {
  const visible = events
    .filter((e) => e.dateFin >= gridStart && e.dateDebut <= gridEnd)
    .sort((a, b) => a.dateDebut.localeCompare(b.dateDebut) || b.dateFin.localeCompare(a.dateFin) || a.nom.localeCompare(b.nom));
  const ends = [];
  const lanes = new Map();
  for (const e of visible) {
    const start = e.dateDebut < gridStart ? gridStart : e.dateDebut;
    let i = ends.findIndex((end) => end < start);
    if (i < 0) { i = ends.length; ends.push(''); }
    ends[i] = e.dateFin > gridEnd ? gridEnd : e.dateFin;
    lanes.set(e.id, i);
  }
  return { visible, lanes, count: ends.length };
}

function laneHtml(iso, col, rowEnd, ctx) {
  let out = '';
  for (let lane = 0; lane < ctx.count; lane++) {
    const ev = ctx.visible.find((e) => ctx.lanes.get(e.id) === lane && e.dateDebut <= iso && e.dateFin >= iso);
    if (!ev) { out += '<div class="lane"></div>'; continue; }
    const start = ev.dateDebut === iso;
    const end = ev.dateFin === iso;
    const showLabel = start || col === 0;
    const n = diffDays(iso, ev.dateFin < rowEnd ? ev.dateFin : rowEnd) + 1;
    const cls = `bar${start ? ' start' : ''}${end ? ' end' : ''}`;
    const lbl = showLabel ? `<span class="lbl" style="width:calc(${n * 100}% + ${n - 1}px - ${start ? 20 : 14}px)">${esc(ev.nom)}</span>` : '';
    out += showLabel
      ? `<div class="lane"><button type="button" class="${cls}" data-action="edit-event" data-id="${esc(ev.id)}" title="${esc(`${ev.nom}, ${periode(ev.dateDebut, ev.dateFin)}`)}" aria-label="${esc(`Événement ${ev.nom}, ${periode(ev.dateDebut, ev.dateFin)}`)}">${lbl}</button></div>`
      : `<div class="lane"><span class="${cls}" data-action="edit-event" data-id="${esc(ev.id)}" aria-hidden="true"></span></div>`;
  }
  return out;
}

function calendarView() {
  const ym = state.month;
  const [y, m] = ym.split('-').map(Number);
  const first = `${ym}-01`;
  const offset = weekday(first);
  const weeks = Math.ceil((offset + new Date(y, m, 0).getDate()) / 7);
  const gridStart = addDays(first, -offset);
  const gridEnd = addDays(gridStart, weeks * 7 - 1);
  const ctx = assignLanes(state.evenements, gridStart, gridEnd);
  const today = todayIso();
  const monthPosts = state.posts.filter((p) => p.datePublication.startsWith(ym));

  const filters = ORDRE.map((s) => {
    const n = monthPosts.filter((p) => p.statut === s).length;
    return `<button type="button" class="filter s-${s}" data-action="toggle-statut" data-statut="${s}" aria-pressed="${!state.hidden.has(s)}">${icon(ICONES[s])}${STATUTS[s]} <span class="n">${n}</span></button>`;
  }).join('');

  let cells = JOURS.map((j) => `<div class="dow">${j}</div>`).join('');
  for (let i = 0; i < weeks * 7; i++) {
    const iso = addDays(gridStart, i);
    const col = i % 7;
    const posts = state.posts.filter((p) => p.datePublication === iso && !state.hidden.has(p.statut)).sort(parHeure);
    const label = dayNum(iso) === 1 ? `1 ${MOIS_COURTS[monthIdx(iso)]}` : dayNum(iso);
    cells += `<div class="day${iso.startsWith(ym) ? '' : ' out'}${col >= 5 ? ' weekend' : ''}${iso === today ? ' today' : ''}">
      <div class="day-head"><span class="dn" ${iso === today ? 'aria-label="Aujourd’hui"' : ''}>${label}</span>
        <button type="button" class="add" data-action="new-post" data-date="${iso}" aria-label="Ajouter un post le ${esc(dateLongue(iso))}">${icon('i-plus')}</button></div>
      <div class="lanes">${laneHtml(iso, col, addDays(iso, 6 - col), ctx)}</div>
      <div class="day-posts">${posts.map(chip).join('')}</div></div>`;
  }

  const empty = monthPosts.length === 0
    ? `<div class="empty"><strong>Aucun post en ${esc(titreMois(ym).toLowerCase())}.</strong><p>Ajoute un post sur un jour du calendrier, ou propose des idées depuis Claude Desktop.</p><button class="btn primary" data-action="new-post">${icon('i-plus')}Nouveau post</button></div>`
    : '';

  return `<div class="cal-bar">
      <div class="cal-nav">
        <button class="icon-btn" data-action="nav-prev" aria-label="Mois précédent">${icon('i-left')}</button>
        <h2 aria-live="polite">${esc(titreMois(ym))}</h2>
        <button class="icon-btn" data-action="nav-next" aria-label="Mois suivant">${icon('i-right')}</button>
        <button class="btn" data-action="nav-today">Aujourd’hui</button>
      </div>
      <div class="filters" role="group" aria-label="Statuts affichés">${filters}</div>
    </div>
    <div class="grid" role="presentation">${cells}</div>
    ${agendaHtml(ym)}
    ${empty}`;
}

function agendaHtml(ym) {
  const days = [...new Set(state.posts.filter((p) => p.datePublication.startsWith(ym) && !state.hidden.has(p.statut)).map((p) => p.datePublication))].sort();
  const first = `${ym}-01`;
  const last = `${ym}-${pad(new Date(Number(ym.slice(0, 4)), Number(ym.slice(5)), 0).getDate())}`;
  const evs = state.evenements.filter((e) => e.dateFin >= first && e.dateDebut <= last);
  const evHtml = evs.length
    ? `<div class="ag-events">${evs.map((e) => `<button type="button" class="ag-ev" data-action="edit-event" data-id="${esc(e.id)}"><strong>${esc(e.nom)}</strong><small>${esc(periode(e.dateDebut, e.dateFin))}</small></button>`).join('')}</div>`
    : '';
  const dayHtml = days.map((iso) => `<section class="ag-day"><div class="cdate"><span class="n">${dayNum(iso)}</span><small>${JOURS_COURTS[weekday(iso)]}</small></div>
    <div class="ag-posts">${state.posts.filter((p) => p.datePublication === iso && !state.hidden.has(p.statut)).sort(parHeure).map(chip).join('')}</div></section>`).join('');
  return `<div class="agenda">${evHtml}${dayHtml}</div>`;
}

/* ---- à valider ---- */
function validateView() {
  const ideas = state.posts.filter((p) => p.statut === 'idee').sort((a, b) => a.datePublication.localeCompare(b.datePublication) || parHeure(a, b));
  if (!ideas.length) {
    return `<div class="empty"><strong>Tout est décidé.</strong><p>Aucun post n’attend de validation pour le moment.</p><button class="btn primary" data-action="new-post">${icon('i-plus')}Nouveau post</button></div>`;
  }
  const today = todayIso();
  let html = '<div class="list">';
  let current = '';
  for (const p of ideas) {
    const ym = p.datePublication.slice(0, 7);
    if (ym !== current) { current = ym; html += `</div><h2 class="group-title">${esc(titreMois(ym))}</h2><div class="list">`; }
    const ev = p.eventId ? evById(p.eventId) : null;
    const past = p.datePublication < today;
    html += `<article class="card idea${past ? ' past' : ''}" aria-labelledby="t-${esc(p.id)}">
      <div class="cdate"><small>${JOURS_COURTS[weekday(p.datePublication)]}</small><span class="n">${dayNum(p.datePublication)}</span><small>${MOIS_COURTS[monthIdx(p.datePublication)]}</small></div>
      <div>
        <h3 id="t-${esc(p.id)}">${esc(p.titre)}${past ? '<span class="tag-past">Date passée</span>' : ''}</h3>
        <p class="meta">${p.heure ? `${heureFr(p.heure)} sur ` : 'Sur '}${esc(listeFr(p.plateformes))}${p.atelier ? `. Atelier : ${esc(p.atelier)}` : ''}</p>
        ${p.description ? `<p class="legende">${esc(p.description)}</p>` : ''}
        ${p.hashtags ? `<p class="tags">${esc(p.hashtags)}</p>` : ''}
        ${photosHtml(p)}
        <dl class="facts">
          ${p.imageIdee ? `<div><dt>Visuel</dt><dd>${esc(p.imageIdee)}</dd></div>` : ''}
          ${p.angle ? `<div><dt>Angle</dt><dd>${esc(p.angle)}</dd></div>` : ''}
          ${ev ? `<div class="evnote"><p><strong>${esc(ev.nom)}</strong>, ${esc(periode(ev.dateDebut, ev.dateFin))}</p>${ev.explication ? `<p>${esc(ev.explication)}</p>` : ''}${ev.lienElisa30 ? `<p>${esc(ev.lienElisa30)}</p>` : ''}</div>` : ''}
          ${p.vigilance ? `<div class="alert">${icon('i-warn')}<p><strong>À vérifier avant de publier.</strong> ${esc(p.vigilance)}</p></div>` : ''}
        </dl>
      </div>
      <div class="actions">
        <button class="btn ok" data-action="set-statut" data-id="${esc(p.id)}" data-statut="valide">${icon('i-check')}Valider</button>
        <button class="btn no" data-action="set-statut" data-id="${esc(p.id)}" data-statut="refuse">${icon('i-x')}Refuser</button>
        <button class="btn" data-action="edit-post" data-id="${esc(p.id)}">Modifier</button>
      </div></article>`;
  }
  return `${html}</div>`;
}

/* ---- événements ---- */
function eventsView() {
  const today = todayIso();
  const evs = state.evenements;
  if (!evs.length) {
    return `<div class="empty"><strong>Aucun événement.</strong><p>Les événements (Octobre Rose, Semaine du Goût, DuoDay…) donnent le contexte de chaque post.</p><button class="btn primary" data-action="new-event">${icon('i-plus')}Nouvel événement</button></div>`;
  }
  const card = (e) => {
    const posts = state.posts.filter((p) => p.eventId === e.id).sort((a, b) => a.datePublication.localeCompare(b.datePublication));
    const upcoming = e.dateFin >= today;
    return `<article class="card ev-card" style="grid-template-columns:minmax(0,1fr)">
      <div>
        <h3>${esc(e.nom)}<span class="meta">${esc(periode(e.dateDebut, e.dateFin))}</span>
          ${upcoming && !posts.length ? '<span class="pill warn">Aucun post prévu</span>' : ''}</h3>
        ${e.explication ? `<p style="margin-top:8px">${esc(e.explication)}</p>` : ''}
        ${e.lienElisa30 ? `<p class="meta" style="margin-top:6px">Lien avec Elisa30 : ${esc(e.lienElisa30)}</p>` : ''}
        ${posts.length ? `<div class="ev-posts">${posts.map(chip).join('')}</div>` : ''}
        <div class="actions" style="grid-column:auto">
          <button class="btn small" data-action="new-post" data-event="${esc(e.id)}" data-date="${upcoming && e.dateDebut < today ? today : e.dateDebut}">${icon('i-plus')}Ajouter un post</button>
          <button class="btn small" data-action="edit-event" data-id="${esc(e.id)}">Modifier l’événement</button>
        </div>
      </div></article>`;
  };
  const avenir = evs.filter((e) => e.dateFin >= today);
  const passes = evs.filter((e) => e.dateFin < today).reverse();
  return `<div class="cal-bar"><h2 style="font-size:27px">Événements</h2><div class="top-actions"><button class="btn" data-action="new-event">${icon('i-plus')}Nouvel événement</button></div></div>
    ${avenir.length ? `<h2 class="group-title">À venir</h2><div class="list">${avenir.map(card).join('')}</div>` : ''}
    ${passes.length ? `<h2 class="group-title">Passés</h2><div class="list">${passes.map(card).join('')}</div>` : ''}`;
}

/* ================= tiroir : post ================= */
function openDrawer(html) {
  const dlg = $('#drawer');
  dlg.innerHTML = html;
  dlg._dirty = false;
  dlg.querySelector('form').addEventListener('input', () => { dlg._dirty = true; });
  dlg.showModal();
  const first = dlg.querySelector('input[type=text],input[type=date]');
  if (first && !dlg.querySelector('[data-edit]')) first.focus();
}

function evInfoHtml(id) {
  const ev = id ? evById(id) : null;
  if (!ev) return '<p class="hint">Contenu sans événement : un post « coulisses » ou une idée libre.</p>';
  return `<div class="evnote"><p><strong>${esc(periode(ev.dateDebut, ev.dateFin))}</strong></p>${ev.explication ? `<p>${esc(ev.explication)}</p>` : ''}${ev.lienElisa30 ? `<p>${esc(ev.lienElisa30)}</p>` : ''}</div>`;
}

function postForm(p, isNew) {
  const evOptions = ['<option value="">Aucun événement</option>']
    .concat(state.evenements.map((e) => `<option value="${esc(e.id)}"${p.eventId === e.id ? ' selected' : ''}>${esc(e.nom)}, ${esc(periode(e.dateDebut, e.dateFin))}</option>`)).join('');
  const nets = RESEAUX.map((n) => `<label class="opt"><input type="checkbox" name="plateformes" value="${n}"${p.plateformes.includes(n) ? ' checked' : ''}><span>${n}</span></label>`).join('');
  const sts = ORDRE.map((s) => `<label class="opt st-${s}"><input type="radio" name="statut" value="${s}"${p.statut === s ? ' checked' : ''}><span>${icon(ICONES[s])}${STATUTS[s]}</span></label>`).join('');
  return `<header class="dr-head"><h2 id="dlgTitle">${isNew ? 'Nouveau post' : 'Modifier le post'}</h2>
      <button type="button" class="icon-btn" data-action="close-dialog" aria-label="Fermer">${icon('i-x')}</button></header>
    <form class="dr-form" data-form="post" data-id="${esc(p.id || '')}" ${isNew ? '' : 'data-edit'} novalidate>
      <div class="dr-body">
        <div class="form-error" role="alert" hidden></div>
        <label class="f"><span>Titre <em>obligatoire</em></span><input type="text" name="titre" maxlength="200" required value="${esc(p.titre)}"></label>
        <div class="row2">
          <label class="f"><span>Date de publication <em>obligatoire</em></span><input type="date" name="datePublication" required value="${esc(p.datePublication)}"></label>
          <label class="f"><span>Heure</span><input type="time" name="heure" value="${esc(p.heure)}"></label>
        </div>
        <fieldset><legend>Réseaux <em>au moins un</em></legend><div class="pills">${nets}</div></fieldset>
        <label class="f"><span>Événement lié</span><select name="eventId">${evOptions}</select></label>
        <div class="evinfo" id="evInfo" aria-live="polite">${evInfoHtml(p.eventId)}</div>
        <label class="f"><span>Description (légende du post)</span><textarea name="description" rows="8" maxlength="5000">${esc(p.description)}</textarea></label>
        <label class="f"><span>Hashtags</span><input type="text" name="hashtags" value="${esc(p.hashtags)}" placeholder="#ESAT #Handicap"></label>
        <p class="count" id="count" aria-live="polite"></p>
        <label class="f"><span>Idée d’image</span><textarea name="imageIdee" rows="2" maxlength="1000">${esc(p.imageIdee)}</textarea></label>
        <fieldset class="photos"><legend>Photo <em>facultative</em></legend>
          <div class="ph-grid">${photoSlotHtml(p, 'meta')}${photoSlotHtml(p, 'linkedin')}</div>
          <p class="hint">Instagram et Facebook utilisent la même photo. LinkedIn a la sienne. Seuls les réseaux cochés plus haut apparaissent ici.</p>
        </fieldset>
        <label class="f"><span>Atelier ou thème</span><input type="text" name="atelier" maxlength="200" value="${esc(p.atelier)}" placeholder="Cuisine, Espaces verts, Transversal…"></label>
        <label class="f"><span>Angle du post</span><textarea name="angle" rows="2" maxlength="1000">${esc(p.angle)}</textarea></label>
        <label class="f"><span>Point de vigilance</span><textarea name="vigilance" rows="2" maxlength="2000">${esc(p.vigilance)}</textarea></label>
        <fieldset><legend>Statut</legend><div class="pills">${sts}</div></fieldset>
      </div>
      <footer class="dr-foot">
        ${isNew ? '' : '<button type="button" class="btn danger" data-action="delete-arm">Supprimer</button>'}
        <span class="spacer"></span>
        <button type="button" class="btn" data-action="close-dialog">Annuler</button>
        <button type="submit" class="btn primary">Enregistrer</button>
      </footer></form>`;
}

function updateCount(form) {
  const el = form.querySelector('#count');
  if (!el) return;
  const get = (n) => form.elements[n].value.trim();
  const texte = get('description') + (get('hashtags') ? `\n\n${get('hashtags')}` : '');
  const nets = [...form.querySelectorAll('input[name=plateformes]:checked')].map((i) => i.value);
  const depasse = nets.filter((n) => LIMITES[n] && texte.length > LIMITES[n]);
  el.className = `count${depasse.length ? ' over' : ''}`;
  el.textContent = depasse.length
    ? `${texte.length} caractères avec les hashtags : trop long pour ${listeFr(depasse)} (maximum ${listeFr(depasse.map((n) => `${LIMITES[n].toLocaleString('fr-FR')}`))}).`
    : `${texte.length.toLocaleString('fr-FR')} caractères avec les hashtags. Limites : Instagram 2 200, LinkedIn 3 000.`;
}

function openPost(id, defaults = {}) {
  const existing = id ? postById(id) : null;
  const base = existing || { id: '', photos: { meta: null, linkedin: null }, titre: '', datePublication: defaults.date || (todayIso().startsWith(state.month) ? todayIso() : `${state.month}-01`), heure: '', plateformes: ['Instagram', 'Facebook'], eventId: defaults.eventId || '', description: '', hashtags: '', imageIdee: '', atelier: '', angle: '', vigilance: '', statut: 'idee' };
  const p = { ...base, eventId: base.eventId || '' };
  openDrawer(postForm(p, !existing));
  $('#drawer')._photos = { meta: { blob: null, url: '', remove: false }, linkedin: { blob: null, url: '', remove: false } };
  const form = $('#drawer form');
  updateCount(form);
  hydratePhotos($('#drawer'));
}

/* ================= tiroir : événement ================= */
function openEvent(id, defaults = {}) {
  const ev = id ? evById(id) : null;
  const e = ev || { id: '', nom: '', dateDebut: defaults.date || todayIso(), dateFin: '', explication: '', lienElisa30: '' };
  const posts = ev ? state.posts.filter((p) => p.eventId === ev.id).sort((a, b) => a.datePublication.localeCompare(b.datePublication)) : [];
  openDrawer(`<header class="dr-head"><h2 id="dlgTitle">${ev ? 'Modifier l’événement' : 'Nouvel événement'}</h2>
      <button type="button" class="icon-btn" data-action="close-dialog" aria-label="Fermer">${icon('i-x')}</button></header>
    <form class="dr-form" data-form="event" data-id="${esc(e.id)}" ${ev ? 'data-edit' : ''} novalidate>
      <div class="dr-body">
        <div class="form-error" role="alert" hidden></div>
        <label class="f"><span>Nom <em>obligatoire</em></span><input type="text" name="nom" maxlength="200" required value="${esc(e.nom)}"></label>
        <div class="row2">
          <label class="f"><span>Date de début <em>obligatoire</em></span><input type="date" name="dateDebut" required value="${esc(e.dateDebut)}"></label>
          <label class="f"><span>Date de fin</span><input type="date" name="dateFin" value="${esc(e.dateFin === e.dateDebut ? '' : e.dateFin)}"></label>
        </div>
        <p class="hint">Laisse la date de fin vide pour un événement d’un seul jour.</p>
        <label class="f"><span>Ce qu’il faut savoir</span><textarea name="explication" rows="5" maxlength="3000">${esc(e.explication)}</textarea></label>
        <label class="f"><span>Lien avec Elisa30</span><textarea name="lienElisa30" rows="3" maxlength="2000">${esc(e.lienElisa30)}</textarea></label>
        ${ev ? `<div class="f"><span>Posts liés (${posts.length})</span>${posts.length ? `<div class="ev-posts">${posts.map(chip).join('')}</div>` : '<p class="hint">Aucun post pour cet événement.</p>'}
          <div><button type="button" class="btn small" data-action="new-post" data-event="${esc(ev.id)}" data-date="${esc(ev.dateDebut)}">${icon('i-plus')}Ajouter un post</button></div></div>` : ''}
      </div>
      <footer class="dr-foot">
        ${ev ? '<button type="button" class="btn danger" data-action="delete-arm">Supprimer</button>' : ''}
        <span class="spacer"></span>
        <button type="button" class="btn" data-action="close-dialog">Annuler</button>
        <button type="submit" class="btn primary">Enregistrer</button>
      </footer></form>`);
}

/* ================= enregistrement ================= */
function formError(form, message) {
  const el = form.querySelector('.form-error');
  el.textContent = message;
  el.hidden = !message;
  if (message) el.scrollIntoView({ block: 'nearest' });
}

async function submitForm(form) {
  const id = form.dataset.id;
  const fd = new FormData(form);
  const kind = form.dataset.form;
  let payload;
  if (kind === 'post') {
    payload = {
      titre: fd.get('titre'), datePublication: fd.get('datePublication'), heure: fd.get('heure') || '',
      plateformes: fd.getAll('plateformes'), eventId: fd.get('eventId') || null, description: fd.get('description'),
      hashtags: fd.get('hashtags'), imageIdee: fd.get('imageIdee'), atelier: fd.get('atelier'), angle: fd.get('angle'),
      vigilance: fd.get('vigilance'), statut: fd.get('statut'),
    };
  } else {
    payload = { nom: fd.get('nom'), dateDebut: fd.get('dateDebut'), dateFin: fd.get('dateFin') || '', explication: fd.get('explication'), lienElisa30: fd.get('lienElisa30') };
  }
  const base = kind === 'post' ? '/api/posts' : '/api/evenements';
  const btn = form.querySelector('[type=submit]');
  btn.disabled = true;
  try {
    formError(form, '');
    const saved = id ? await api('PUT', `${base}/${id}`, payload) : await api('POST', base, payload);
    let photoErr = '';
    if (kind === 'post') {
      try { await applyPhotos(saved.id, $('#drawer')._photos, payload.plateformes); } catch (e) { photoErr = e.message; }
    }
    $('#drawer')._dirty = false;
    $('#drawer').close();
    await refresh();
    if (kind === 'post' && payload.datePublication) state.month = payload.datePublication.slice(0, 7);
    render();
    if (photoErr) toast(`Post enregistré, mais la photo n’a pas pu être envoyée : ${photoErr}`, { error: true });
    else toast(kind === 'post' ? 'Post enregistré.' : 'Événement enregistré.');
  } catch (err) {
    formError(form, err.message);
    btn.disabled = false;
  }
}

async function deleteCurrent(form) {
  const id = form.dataset.id;
  const kind = form.dataset.form;
  try {
    const res = await api('DELETE', `${kind === 'post' ? '/api/posts' : '/api/evenements'}/${id}`);
    $('#drawer')._dirty = false;
    $('#drawer').close();
    await refresh();
    toast(kind === 'post' ? 'Post supprimé.' : `Événement supprimé${res.postsDetaches ? `, ${res.postsDetaches} post(s) conservé(s) sans événement` : ''}.`);
  } catch (err) { formError(form, err.message); }
}

async function setStatut(id, statut) {
  const p = postById(id);
  if (!p) return;
  const avant = p.statut;
  await api('PUT', `/api/posts/${id}`, { statut });
  await refresh();
  const verbe = { valide: 'validé', refuse: 'refusé', publie: 'publié', idee: 'remis à valider' }[statut];
  toast(`« ${p.titre.length > 48 ? `${p.titre.slice(0, 47)}…` : p.titre} » ${verbe}.`, {
    undo: () => guard(async () => { await api('PUT', `/api/posts/${id}`, { statut: avant }); await refresh(); toast('Changement annulé.'); }),
  });
}

/* ================= export Excel ================= */
function exportParams(form) {
  const statuts = [...form.querySelectorAll('input[name=statuts]:checked')].map((i) => i.value);
  const mode = form.querySelector('input[name=periode]:checked').value;
  const ym = state.month;
  let du = '';
  let au = '';
  if (mode === 'futur') du = todayIso();
  if (mode === 'mois') { du = `${ym}-01`; au = `${ym}-${pad(new Date(Number(ym.slice(0, 4)), Number(ym.slice(5)), 0).getDate())}`; }
  if (mode === 'dates') { du = form.elements.du.value; au = form.elements.au.value; }
  const photos = form.elements.photos ? form.elements.photos.checked : true;
  return { statuts, du, au, photos };
}

function exportCount(params) {
  return state.posts.filter((p) => params.statuts.includes(p.statut) && (!params.du || p.datePublication >= params.du) && (!params.au || p.datePublication <= params.au)).length;
}

function openExport() {
  const dlg = $('#exportDlg');
  const mois = titreMois(state.month).toLowerCase();
  const stat = (s, checked) => `<label class="radio"><input type="checkbox" name="statuts" value="${s}"${checked ? ' checked' : ''}>${STATUTS[s]}</label>`;
  const per = (v, label, checked) => `<label class="radio"><input type="radio" name="periode" value="${v}"${checked ? ' checked' : ''}>${label}</label>`;
  dlg.innerHTML = `<form class="modal-form" data-form="export">
    <header class="modal-head"><h2 id="dlgTitle">Exporter en Excel</h2><button type="button" class="icon-btn" data-action="close-dialog" aria-label="Fermer">${icon('i-x')}</button></header>
    <fieldset><legend>Posts à inclure</legend>${stat('valide', true)}${stat('publie', true)}${stat('idee', false)}${stat('refuse', false)}</fieldset>
    ${state.posts.some(hasPhoto) ? `<fieldset><legend>Photos</legend><label class="radio"><input type="checkbox" name="photos" checked>Inclure les photos dans le fichier (plus lourd)</label></fieldset>` : ''}
    <fieldset><legend>Période</legend>
      ${per('futur', 'À partir d’aujourd’hui', true)}${per('mois', `Mois affiché (${esc(mois)})`, false)}${per('tout', 'Toutes les dates', false)}${per('dates', 'Dates précises', false)}
      <div class="sub-dates" hidden><label class="f"><span>Du</span><input type="date" name="du"></label><label class="f"><span>Au</span><input type="date" name="au"></label></div>
    </fieldset>
    <p class="export-count" id="exportCount" aria-live="polite"></p>
    <div class="modal-foot"><button type="button" class="btn" data-action="close-dialog">Annuler</button><button type="submit" class="btn primary">${icon('i-down')}Télécharger l’Excel</button></div></form>`;
  const form = dlg.querySelector('form');
  const update = () => {
    form.querySelector('.sub-dates').hidden = form.querySelector('input[name=periode]:checked').value !== 'dates';
    const params = exportParams(form);
    const n = exportCount(params);
    form.querySelector('#exportCount').textContent = n === 0 ? 'Aucun post ne correspond à ces choix.' : `${n} post${n > 1 ? 's' : ''} ${n > 1 ? 'seront exportés' : 'sera exporté'}.`;
    form.querySelector('[type=submit]').disabled = n === 0;
  };
  form.addEventListener('input', update);
  form.addEventListener('submit', (e) => { e.preventDefault(); guard(() => downloadExcel(exportParams(form), dlg)); });
  update();
  dlg.showModal();
}

async function downloadExcel(params, dlg) {
  const q = new URLSearchParams({ statuts: params.statuts.join(',') });
  if (params.du) q.set('du', params.du);
  if (params.au) q.set('au', params.au);
  if (params.photos === false) q.set('photos', '0');
  const res = await request('GET', `/api/export.xlsx?${q}`);
  if (!res.ok) {
    const data = await res.json().catch(() => null);
    throw new Error((data && data.error) || `Export impossible (erreur ${res.status}).`);
  }
  const m = (res.headers.get('Content-Disposition') || '').match(/filename\*=UTF-8''([^;]+)/);
  const name = m ? decodeURIComponent(m[1]) : 'Calendrier_editorial_Elisa30.xlsx';
  const url = URL.createObjectURL(await res.blob());
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  dlg.close();
  toast(`${name} téléchargé.`);
}

/* ================= événements du DOM ================= */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) {
    // clic sur le fond du tiroir ou d’une fenêtre : fermeture
    if (e.target instanceof HTMLDialogElement && e.target.id !== 'tokenDlg') closeDialog(e.target);
    return;
  }
  const d = t.dataset;
  switch (d.action) {
    case 'view': state.view = d.view; render(); window.scrollTo(0, 0); break;
    case 'nav-prev': state.month = shiftMonth(state.month, -1); render(); break;
    case 'nav-next': state.month = shiftMonth(state.month, 1); render(); break;
    case 'nav-today': state.month = todayIso().slice(0, 7); render(); break;
    case 'toggle-statut': state.hidden.has(d.statut) ? state.hidden.delete(d.statut) : state.hidden.add(d.statut); render(); break;
    case 'new-post': {
      const dlg = $('#drawer');
      if (dlg.open) { dlg._dirty = false; dlg.close(); }
      openPost(null, { date: d.date, eventId: d.event });
      break;
    }
    case 'edit-post': {
      const dlg = $('#drawer');
      if (dlg.open) { dlg._dirty = false; dlg.close(); }
      openPost(d.id);
      break;
    }
    case 'new-event': openEvent(null); break;
    case 'edit-event': {
      const dlg = $('#drawer');
      if (dlg.open) { dlg._dirty = false; dlg.close(); }
      openEvent(d.id);
      break;
    }
    case 'set-statut': guard(() => setStatut(d.id, d.statut)); break;
    case 'photo-pick': t.closest('.ph-slot').querySelector('input[type=file]').click(); break;
    case 'photo-remove': photoRemoved(t.closest('form'), d.slot); break;
    case 'open-export': openExport(); break;
    case 'close-dialog': closeDialog(t.closest('dialog')); break;
    case 'delete-arm':
      if (t.classList.contains('armed')) { guard(() => deleteCurrent(t.closest('form'))); break; }
      t.classList.add('armed');
      t.textContent = 'Confirmer la suppression';
      setTimeout(() => { if (t.isConnected) { t.classList.remove('armed'); t.textContent = 'Supprimer'; } }, 5000);
      break;
    case 'undo': { const el = $('#toast'); const fn = el._undo; el.hidden = true; el._undo = null; if (fn) fn(); break; }
    default: break;
  }
});

function closeDialog(dlg) {
  if (dlg && dlg._dirty && !window.confirm('Abandonner les modifications en cours ?')) return;
  if (dlg) dlg.close();
}

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form=post],form[data-form=event]');
  if (!form) return;
  e.preventDefault();
  const missing = [...form.querySelectorAll('[required]')].find((i) => !i.value.trim());
  if (missing) { formError(form, 'Complète les champs obligatoires.'); missing.focus(); return; }
  if (form.dataset.form === 'post' && !form.querySelector('input[name=plateformes]:checked')) { formError(form, 'Choisis au moins un réseau.'); return; }
  submitForm(form);
});

document.addEventListener('input', (e) => {
  const form = e.target.closest('form[data-form=post]');
  if (form) updateCount(form);
});
document.addEventListener('change', (e) => {
  if (e.target.name === 'eventId') $('#evInfo').innerHTML = evInfoHtml(e.target.value);
  if (e.target.name === 'plateformes') photoSlotsSync(e.target.closest('form'));
  if (e.target.matches && e.target.matches('input[data-photo-input]')) photoChosen(e.target);
});

// Échap : demander confirmation si le tiroir contient des modifications
$('#drawer').addEventListener('cancel', (e) => {
  const dlg = e.target;
  if (dlg._dirty && !window.confirm('Abandonner les modifications en cours ?')) e.preventDefault();
});
$('#tokenDlg').addEventListener('cancel', (e) => e.preventDefault());
for (const id of ['drawer', 'exportDlg', 'tokenDlg']) {
  $(`#${id}`).addEventListener('close', (e) => { e.target.innerHTML = ''; e.target._dirty = false; });
}

/* ================= démarrage ================= */
const poll = () => {
  if (document.visibilityState === 'visible' && !document.querySelector('dialog[open]')) refresh().catch(() => {});
};
setInterval(poll, 20000);
document.addEventListener('visibilitychange', poll);

render();
guard(refresh);
})();
</script>
</body>
</html>
